<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beach Buggy - Piloto 3D y Llantas Limpias</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Luckiest Guy', cursive; user-select: none; }
        canvas { display: block; }
        #hud-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .texto-hud { color: white; font-size: 24px; -webkit-text-stroke: 2px black; text-shadow: 3px 3px 0 #000; letter-spacing: 1px;}
        #barra-progreso { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); width: 40%; height: 22px; background: rgba(0,0,0,0.6); border: 4px solid #fff; border-radius: 12px; display: flex; align-items: center; z-index: 10; box-shadow: 0 4px 8px rgba(0,0,0,0.5);}
        #barra-relleno { height: 100%; width: 15%; background: linear-gradient(90deg, #00aaff, #00ffff); border-radius: 8px; }
        #btn-pausa { position: absolute; top: 20px; right: 20px; width: 45px; height: 45px; background: radial-gradient(circle, #ffffff, #0088ff); border: 4px solid #004488; border-radius: 50%; z-index: 10; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 0 #002244; cursor: pointer; }
        #btn-pausa::before, #btn-pausa::after { content: ''; width: 6px; height: 18px; background: #004488; margin: 0 3px; border-radius: 2px; }
        #controles { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 10; }
        .panel-metal { background: linear-gradient(to bottom, #e0e0e0, #808080); border: 4px solid #222; border-radius: 15px; padding: 12px; box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 8px 0 #111; display: flex; gap: 10px; position: relative; }
        .panel-metal::after { content: ''; position: absolute; bottom: 5px; left: 15px; right: 15px; height: 10px; background-image: radial-gradient(#444 40%, transparent 45%); background-size: 12px 12px; background-position: center; opacity: 0.8; }
        .btn { width: 65px; height: 65px; border-radius: 12px; background: linear-gradient(to bottom, #777, #333); border: 3px solid #111; box-shadow: inset 0 3px 5px rgba(255,255,255,0.4), inset 0 -3px 5px rgba(0,0,0,0.6); color: white; font-size: 26px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-family: 'Luckiest Guy', cursive; text-shadow: 2px 2px 0 #000; }
        .btn:active { box-shadow: inset 0 6px 10px rgba(0,0,0,0.8); transform: translateY(5px); }
        .btn-accion { width: 75px; font-size: 16px; }
        #btn-freno { background: linear-gradient(to bottom, #ff5555, #aa0000); }
        #btn-gas { background: linear-gradient(to bottom, #55ff55, #008800); }
        .item-slot { position: absolute; top: 100px; width: 80px; height: 80px; border-radius: 50%; border: 5px solid #fff; background: radial-gradient(circle, #88ddff, #0055aa); box-shadow: 0 0 20px #00aaff, inset 0 0 15px #003366; z-index: 10; display: flex; justify-content: center; align-items: center; }
        .item-slot::after { content: ''; width: 45px; height: 45px; border-radius: 50%; background: radial-gradient(circle, #ffff00, #ff0000); box-shadow: 0 0 15px #ff0000; border: 3px solid #fff; }
        #item-izq { left: 20px; }
        #item-der { right: 20px; background: radial-gradient(circle, #88ff88, #006600); box-shadow: 0 0 20px #00ff00, inset 0 0 15px #003300; }
        #item-der::after { background: radial-gradient(circle, #ffffff, #0088ff); box-shadow: 0 0 15px #00aaff; }
    </style>
</head>
<body>
    <div id="hud-top"><div class="texto-hud" id="txt-puesto">PUESTO 6/6</div><div class="texto-hud" id="txt-vuelta">VUELTA 1/1</div></div>
    <div id="barra-progreso"><div id="barra-relleno"></div></div>
    <div id="btn-pausa"></div>
    <div id="item-izq" class="item-slot"></div>
    <div id="item-der" class="item-slot"></div>
    <div id="controles">
        <div class="panel-metal"><div class="btn" id="btn-izq">◀</div><div class="btn" id="btn-der">▶</div></div>
        <div class="panel-metal"><div class="btn btn-accion" id="btn-freno">FRENO</div><div class="btn btn-accion" id="btn-gas">GAS</div></div>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script>
        let scene, camera, renderer, reloj;
        let coche, piloto, ruedas = [], fuegoEscape, particulasPolvo;
        let velocidad = 0, direccion = 0, acelerando = false, frenando = false, tiempoGlobal = 0;
        const VELOCIDAD_MAXIMA = 35, ACELERACION = 15, FRENADO = 25, VELOCIDAD_GIRO = 1.5;

        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, -9); 
            reloj = new THREE.Clock();

            const sol = new THREE.DirectionalLight(0xfff5e6, 3.0);
            sol.position.set(40, 60, -30);
            sol.castShadow = true;
            sol.shadow.mapSize.width = 2048; sol.shadow.mapSize.height = 2048;
            sol.shadow.camera.left = -60; sol.shadow.camera.right = 60; sol.shadow.camera.top = 60; sol.shadow.camera.bottom = -60;
            sol.shadow.bias = -0.0005;
            scene.add(sol);

            const ambiente = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambiente);
            const hemisferio = new THREE.HemisphereLight(0xffffff, 0x8b5a2b, 1.2);
            scene.add(hemisferio);

            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            const envCanvas = document.createElement('canvas');
            envCanvas.width = 512; envCanvas.height = 512;
            const eCtx = envCanvas.getContext('2d');
            const eGrad = eCtx.createLinearGradient(0, 0, 0, 512);
            eGrad.addColorStop(0, '#ffffff'); eGrad.addColorStop(0.5, '#87CEEB'); eGrad.addColorStop(1, '#e3c28d');
            eCtx.fillStyle = eGrad; eCtx.fillRect(0, 0, 512, 512);
            const envTexture = new THREE.CanvasTexture(envCanvas);
            envTexture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = pmremGenerator.fromEquirectangular(envTexture).texture;

            crearEntorno();
            crearCoche();
            crearParticulas();
            configurarControles();
            window.addEventListener('resize', onWindowResize);
            animate();
        }
        function crearEntorno() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#e3c28d'; ctx.fillRect(0, 0, 1024, 1024); 
    for (let i = 0; i < 80000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#d1ab70' : '#f0d5ab';
        ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
    }
    ctx.fillStyle = '#a87d4b';
    ctx.beginPath(); ctx.moveTo(412, 0); ctx.lineTo(612, 0); ctx.quadraticCurveTo(700, 512, 600, 1024); ctx.lineTo(424, 1024); ctx.quadraticCurveTo(324, 512, 412, 0); ctx.fill();
    
    const texturaSuelo = new THREE.CanvasTexture(canvas);
    texturaSuelo.wrapS = THREE.RepeatWrapping; texturaSuelo.wrapT = THREE.RepeatWrapping; texturaSuelo.repeat.set(20, 20);
    const suelo = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: texturaSuelo, roughness: 1.0, metalness: 0.0 }));
    suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);

    const matRoca = new THREE.MeshStandardMaterial({ color: 0x7a8471, flatShading: true, roughness: 0.9 });
    for(let i=0; i<20; i++) {
        const esIzq = i % 2 === 0;
        const roca = new THREE.Mesh(new THREE.DodecahedronGeometry(20 + Math.random() * 30, 1), matRoca);
        roca.position.set(esIzq ? -100 - Math.random()*80 : 100 + Math.random()*80, 10, (Math.random() - 0.5) * 500);
        roca.rotation.set(Math.random(), Math.random(), Math.random());
        roca.castShadow = true; roca.receiveShadow = true; scene.add(roca);
    }

    const matTronco = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
    const matHoja = new THREE.MeshStandardMaterial({ color: 0x1f7a1f, flatShading: true, side: THREE.DoubleSide });
    for (let i = 0; i < 30; i++) {
        const palmera = new THREE.Group();
        const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.6, 10, 8), matTronco); 
        tronco.position.y = 5; tronco.castShadow = true; palmera.add(tronco);
        for (let j = 0; j < 8; j++) {
            const hoja = new THREE.Mesh(new THREE.PlaneGeometry(2, 8), matHoja);
            hoja.position.y = 10; hoja.rotation.x = -Math.PI / 2.5; hoja.rotation.y = (Math.PI * 2 / 8) * j;
            hoja.position.x = Math.sin((Math.PI * 2 / 8) * j) * 3; hoja.position.z = Math.cos((Math.PI * 2 / 8) * j) * 3;
            hoja.castShadow = true; palmera.add(hoja);
        }
        const lado = Math.random() > 0.5 ? 1 : -1;
        palmera.position.set(lado * (30 + Math.random() * 60), 0, (Math.random() - 0.5) * 300); 
        scene.add(palmera);
    }
        }
        function crearCoche() {
    coche = new THREE.Group();
    const matRojo = new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.6, roughness: 0.2 });
    const matBlanco = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.3, roughness: 0.3 });
    const matNegro = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.4 });
    const matCromo = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 1.0, roughness: 0.05 });

    // 1. CHASIS
    const cuerpo = new THREE.Mesh(new THREE.CapsuleGeometry(0.9, 2.8, 16, 32), matRojo);
    cuerpo.rotation.x = Math.PI / 2; cuerpo.rotation.z = Math.PI / 2;
    cuerpo.position.set(0, 1.2, 0); cuerpo.scale.set(1.6, 1, 0.7);
    cuerpo.castShadow = true; cuerpo.receiveShadow = true; coche.add(cuerpo);

    // 2. CALCOMANÍA "01"
    const canvasDecal = document.createElement('canvas');
    canvasDecal.width = 512; canvasDecal.height = 512;
    const ctxD = canvasDecal.getContext('2d');
    ctxD.fillStyle = '#cc0000'; ctxD.fillRect(0,0,512,512);
    ctxD.fillStyle = '#ffffff'; ctxD.fillRect(0, 200, 512, 100);
    ctxD.fillStyle = '#ffffff'; ctxD.font = 'bold 250px Arial'; ctxD.textAlign = 'center'; ctxD.textBaseline = 'middle';
    ctxD.fillText('01', 256, 256);
    const texturaDecal = new THREE.CanvasTexture(canvasDecal);
    const matDecal = new THREE.MeshStandardMaterial({ map: texturaDecal, metalness: 0.4, roughness: 0.3 });
    const lateralIzq = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 1.4), matDecal);
    lateralIzq.position.set(-1.25, 1.2, 0); lateralIzq.rotation.y = -Math.PI/2; coche.add(lateralIzq);
    const lateralDer = lateralIzq.clone(); lateralDer.position.x = 1.25; lateralDer.rotation.y = Math.PI/2; coche.add(lateralDer);

    // 3. JAULA
    const matJaula = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.9, roughness: 0.3 });
    const puntosJaula = [
        new THREE.Vector3(-1.1, 1.5, -1.6), new THREE.Vector3(-1.1, 3.0, -0.8), new THREE.Vector3(-0.9, 3.2, 0.8), new THREE.Vector3(-0.9, 1.8, 1.6),
        new THREE.Vector3(0.9, 1.8, 1.6), new THREE.Vector3(0.9, 3.2, 0.8), new THREE.Vector3(1.1, 3.0, -0.8), new THREE.Vector3(1.1, 1.5, -1.6)
    ];
    const curvaJaula = new THREE.CatmullRomCurve3(puntosJaula);
    const jaula = new THREE.Mesh(new THREE.TubeGeometry(curvaJaula, 64, 0.1, 12, false), matJaula);
    jaula.castShadow = true; coche.add(jaula);

    const tuboTravesaño = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.2, 8), matJaula);
    tuboTravesaño.rotation.z = Math.PI / 2; tuboTravesaño.position.set(0, 3.2, 0.8); coche.add(tuboTravesaño);

    // 4. MOTOR
    const motorBase = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 1.2), matNegro);
    motorBase.position.set(0, 1.6, -1.8); motorBase.castShadow = true; coche.add(motorBase);
    const tapaIzq = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 1.2), matCromo);
    tapaIzq.position.set(-0.5, 2.1, -1.8); coche.add(tapaIzq);
    const tapaDer = tapaIzq.clone(); tapaDer.position.x = 0.5; coche.add(tapaDer);

    // 5. ESCAPES ENTRE LAS LLANTAS (CENTRALES)
    const escapeGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.8, 16);
    const escapeIzq = new THREE.Mesh(escapeGeo, matCromo);
    escapeIzq.rotation.x = Math.PI / 2; escapeIzq.position.set(-0.25, 0.9, -2.0); coche.add(escapeIzq);
    const escapeDer = escapeIzq.clone(); escapeDer.position.x = 0.25; coche.add(escapeDer);

    // 6. FAROS
    const matLuz = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2.0 });
    for(let i=0; i<4; i++){
        const baseFaro = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.15, 16), matNegro);
        baseFaro.rotation.x = Math.PI / 2; baseFaro.position.set(-0.75 + i*0.5, 3.3, 0.8); coche.add(baseFaro);
        const lenteFaro = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.18, 16), matLuz);
        lenteFaro.rotation.x = Math.PI / 2; lenteFaro.position.set(-0.75 + i*0.5, 3.3, 0.82); coche.add(lenteFaro);
    }

    // 7. ASIENTOS Y VOLANTE
    const asientoIzq = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.5), matNegro);
    asientoIzq.position.set(-0.5, 1.8, -0.2); coche.add(asientoIzq);
    const asientoDer = asientoIzq.clone(); asientoDer.position.x = 0.5; coche.add(asientoDer);
    
    const volante = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.05, 8, 16), matNegro);
    volante.position.set(0, 2.1, 0.6); volante.rotation.x = -Math.PI/4; coche.add(volante);
                // 8. EL PILOTO 3D
    piloto = new THREE.Group();
    const matPiel = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.6 });
    const matOjoBlanco = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
    const matOjoNegro = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
    const matIris = new THREE.MeshStandardMaterial({ color: 0x4a2e15, roughness: 0.3 });

    // Torso y traje
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.4, 8, 16), matRojo);
    torso.position.y = 2.0; torso.castShadow = true; piloto.add(torso);
    const franjaTraje = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.75), matBlanco);
    franjaTraje.position.set(0, 2.0, 0); piloto.add(franjaTraje);
    
    // Arnés
    const arnesIzq = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.7, 0.1), matNegro);
    arnesIzq.position.set(-0.15, 2.0, 0.35); piloto.add(arnesIzq);
    const arnesDer = arnesIzq.clone(); arnesDer.position.x = 0.15; piloto.add(arnesDer);

    // Brazos y guantes
    const brazoGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.5, 12);
    const brazoIzq = new THREE.Mesh(brazoGeo, matRojo);
    brazoIzq.position.set(-0.4, 2.1, 0.2); brazoIzq.rotation.x = Math.PI/3; piloto.add(brazoIzq);
    const brazoDer = brazoIzq.clone(); brazoDer.position.x = 0.4; piloto.add(brazoDer);
    const guanteGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const guanteIzq = new THREE.Mesh(guanteGeo, matNegro); guanteIzq.position.set(-0.4, 1.85, 0.5); piloto.add(guanteIzq);
    const guanteDer = guanteIzq.clone(); guanteDer.position.x = 0.4; piloto.add(guanteDer);

    // --- CABEZA 3D DETALLADA ---
    const cabezaGroup = new THREE.Group();
    cabezaGroup.position.set(0, 2.55, 0.05);

    // Cráneo
    const craneo = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), matPiel);
    craneo.scale.set(1.1, 1.15, 1.0); // Forma de cabeza real
    craneo.castShadow = true; cabezaGroup.add(craneo);

    // Ojos (3D)
    const ojoIzq = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), matOjoBlanco);
    ojoIzq.position.set(-0.12, 0.05, 0.3); cabezaGroup.add(ojoIzq);
    const ojoDer = ojoIzq.clone(); ojoDer.position.x = 0.12; cabezaGroup.add(ojoDer);

    // Iris y Pupilas
    const irisIzq = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), matIris);
    irisIzq.position.set(-0.12, 0.05, 0.37); cabezaGroup.add(irisIzq);
    const irisDer = irisIzq.clone(); irisDer.position.x = 0.12; cabezaGroup.add(irisDer);

    const pupilaIzq = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 16), matOjoNegro);
    pupilaIzq.position.set(-0.12, 0.05, 0.4); cabezaGroup.add(pupilaIzq);
    const pupilaDer = pupilaIzq.clone(); pupilaDer.position.x = 0.12; cabezaGroup.add(pupilaDer);

    // Brillo en los ojos
    const brilloIzq = new THREE.Mesh(new THREE.SphereGeometry(0.01, 8, 8), matOjoBlanco);
    brilloIzq.position.set(-0.1, 0.08, 0.41); cabezaGroup.add(brilloIzq);
    const brilloDer = brilloIzq.clone(); brilloDer.position.x = 0.14; cabezaGroup.add(brilloDer);

    // Cejas (enojadas)
    const cejaIzq = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.03, 0.05), matOjoNegro);
    cejaIzq.position.set(-0.12, 0.16, 0.32); cejaIzq.rotation.z = -0.2; cabezaGroup.add(cejaIzq);
    const cejaDer = cejaIzq.clone(); cejaDer.position.x = 0.12; cejaDer.rotation.z = 0.2; cabezaGroup.add(cejaDer);

    // Nariz
    const nariz = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), matPiel);
    nariz.position.set(0, -0.02, 0.38); cabezaGroup.add(nariz);

    // Boca (Sonrisa)
    const boca = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.015, 8, 16, Math.PI), matOjoNegro);
    boca.position.set(0, -0.15, 0.35); boca.rotation.x = Math.PI; boca.rotation.z = Math.PI; cabezaGroup.add(boca);

    // --- CASCO 3D ---
    const cascoMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.5, roughness: 0.2 });
    const cascoGeo = new THREE.SphereGeometry(0.42, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.65);
    const casco = new THREE.Mesh(cascoGeo, cascoMat);
    casco.rotation.x = -0.1;
    casco.castShadow = true;
    cabezaGroup.add(casco);

    // Franja blanca del casco
    const franjaCasco = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.8), matBlanco);
    franjaCasco.position.set(0, 0.15, -0.05); cabezaGroup.add(franjaCasco);

    // Gafas encima del casco
    const gafas = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.06, 8, 16, Math.PI), matOjoNegro);
    gafas.position.set(0, 0.25, 0.15); gafas.rotation.x = -Math.PI/6; cabezaGroup.add(gafas);
    const cristalGafas = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.05), new THREE.MeshStandardMaterial({color: 0x333333, metalness: 0.9, roughness: 0.1}));
    cristalGafas.position.set(0, 0.25, 0.2); cristalGafas.rotation.x = -Math.PI/6; cabezaGroup.add(cristalGafas);

    piloto.add(cabezaGroup);
    coche.add(piloto);

    // 9. LLANTAS LISAS COROÑOSAS (Sin bloques alrededor)
    const matGoma = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.95 });
    const matRin = new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.8, roughness: 0.2 });
    
    const posRuedas = [[-1.5, 0.9, 1.4], [1.5, 0.9, 1.4], [-1.5, 0.9, -1.4], [1.5, 0.9, -1.4]];
    posRuedas.forEach(pos => {
        const ruedaG = new THREE.Group();
        
        // Llanta principal (súper suave, 64 caras para que no se vea cuadrada)
        const llanta = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.9, 64), matGoma);
        llanta.rotation.z = Math.PI / 2; llanta.castShadow = true; ruedaG.add(llanta);
        
        // Rin Rojo
        const rin = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.92, 32), matRin);
        rin.rotation.z = Math.PI / 2; ruedaG.add(rin);

        // Tapacubos cromado
        const tapacubos = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.95, 16), matCromo);
        tapacubos.rotation.z = Math.PI / 2; ruedaG.add(tapacubos);
        
        // Detalle del rin: 5 radios (para que no se vea vacío)
        for(let r=0; r<5; r++){
            const radio = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.5, 0.1), matCromo);
            radio.position.set(0, 0, 0);
            radio.rotation.x = (r * Math.PI * 2) / 5;
            radio.position.y = Math.sin(radio.rotation.x) * 0.3;
            radio.position.z = Math.cos(radio.rotation.x) * 0.3;
            radio.rotation.y = Math.PI / 2;
            ruedaG.add(radio);
        }

        ruedaG.position.set(pos[0], pos[1], pos[2]);
        coche.add(ruedaG); ruedas.push(ruedaG);
    });

    scene.add(coche);
        }
                function crearParticulas() {
            const geoFuego = new THREE.BufferGeometry();
            const posF = new Float32Array(200 * 3);
            const colF = new THREE.Float32BufferAttribute(new Float32Array(200 * 3), 3);
            for(let i=0; i<200*3; i+=3){
                posF[i] = 0; posF[i+1] = -10; posF[i+2] = 0;
                colF.setXYZ(i/3, Math.random() * 0.5, Math.random() * 0.5 + 0.5, 1.0); 
            }
            geoFuego.setAttribute('position', new THREE.BufferAttribute(posF, 3));
            geoFuego.setAttribute('color', colF);
            fuegoEscape = new THREE.Points(geoFuego, new THREE.PointsMaterial({ size: 0.7, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
            scene.add(fuegoEscape);

            const geoPolvo = new THREE.BufferGeometry();
            const posP = new Float32Array(100 * 3);
            for(let i=0; i<100*3; i+=3){ posP[i] = 0; posP[i+1] = -10; posP[i+2] = 0; }
            geoPolvo.setAttribute('position', new THREE.BufferAttribute(posP, 3));
            particulasPolvo = new THREE.Points(geoPolvo, new THREE.PointsMaterial({ size: 0.8, color: 0xe0c9a6, transparent: true, opacity: 0.5, depthWrite: false }));
            scene.add(particulasPolvo);
        }

        function configurarControles() {
            const btnGas = document.getElementById('btn-gas'), btnFreno = document.getElementById('btn-freno');
            const btnIzq = document.getElementById('btn-izq'), btnDer = document.getElementById('btn-der');

            btnGas.addEventListener('touchstart', (e) => { e.preventDefault(); acelerando = true; });
            btnGas.addEventListener('touchend', (e) => { e.preventDefault(); acelerando = false; });
            btnGas.addEventListener('mousedown', () => acelerando = true);
            btnGas.addEventListener('mouseup', () => acelerando = false);

            btnFreno.addEventListener('touchstart', (e) => { e.preventDefault(); frenando = true; });
            btnFreno.addEventListener('touchend', (e) => { e.preventDefault(); frenando = false; });
            btnFreno.addEventListener('mousedown', () => frenando = true);
            btnFreno.addEventListener('mouseup', () => frenando = false);

            btnIzq.addEventListener('touchstart', (e) => { e.preventDefault(); direccion = -1; });
            btnIzq.addEventListener('touchend', (e) => { e.preventDefault(); direccion = 0; });
            btnIzq.addEventListener('mousedown', () => direccion = -1);
            btnIzq.addEventListener('mouseup', () => direccion = 0);

            btnDer.addEventListener('touchstart', (e) => { e.preventDefault(); direccion = 1; });
            btnDer.addEventListener('touchend', (e) => { e.preventDefault(); direccion = 0; });
            btnDer.addEventListener('mousedown', () => direccion = 1);
            btnDer.addEventListener('mouseup', () => direccion = 0);
        }

        function actualizarParticulas(delta) {
            if (acelerando && velocidad > 0) {
                const pos = fuegoEscape.geometry.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    if (pos[i+1] < 0) {
                        pos[i] = coche.position.x + (Math.random() > 0.5 ? 0.25 : -0.25); 
                        pos[i+1] = 0.9; 
                        pos[i+2] = coche.position.z - 2.1; 
                        break;
                    }
                }
                for (let i = 1; i < pos.length; i += 3) { 
                    if (pos[i] > 0) { 
                        pos[i] += delta * 1.0; 
                        pos[i+1] -= delta * 8; 
                    } 
                }
                fuegoEscape.geometry.attributes.position.needsUpdate = true;
            }

            if (velocidad > 5) {
                const pos = particulasPolvo.geometry.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    if (pos[i+1] < 0) {
                        pos[i] = coche.position.x + (Math.random() > 0.5 ? 1.4 : -1.4);
                        pos[i+1] = 0.2; pos[i+2] = coche.position.z - 1.5; break;
                    }
                }
                for (let i = 1; i < pos.length; i += 3) { if (pos[i] > 0) { pos[i] += delta * 0.5; pos[i+1] -= delta * 1.5; } }
                particulasPolvo.geometry.attributes.position.needsUpdate = true;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = reloj.getDelta();
            tiempoGlobal += delta;

            if (coche) {
                if (acelerando) velocidad += ACELERACION * delta;
                else if (frenando) velocidad -= FRENADO * delta;
                else velocidad -= 5 * delta;

                if (velocidad > VELOCIDAD_MAXIMA) velocidad = VELOCIDAD_MAXIMA;
                if (velocidad < 0) velocidad = 0;

                if (direccion !== 0 && velocidad > 1) coche.rotation.y -= direccion * VELOCIDAD_GIRO * delta * (velocidad / 10);

                const movimientoZ = Math.cos(coche.rotation.y) * velocidad * delta;
                const movimientoX = Math.sin(coche.rotation.y) * velocidad * delta;
                coche.position.z += movimientoZ;
                coche.position.x -= movimientoX;

                coche.position.y = Math.sin(tiempoGlobal * 25) * 0.03;
                coche.rotation.z = Math.sin(tiempoGlobal * 15) * 0.01;

                ruedas.forEach(r => r.children[0].rotation.x += velocidad * delta * 1.5);
                if (ruedas.length >= 2) { ruedas[0].rotation.y = direccion * 0.5; ruedas[1].rotation.y = direccion * 0.5; }

                const offsetCamara = new THREE.Vector3(0, 4.5, -9.5);
                offsetCamara.applyAxisAngle(new THREE.Vector3(0, 1, 0), coche.rotation.y);
                const targetCamara = new THREE.Vector3().copy(coche.position).add(offsetCamara);
                camera.position.lerp(targetCamara, 0.1);
                
                const lookAtPos = new THREE.Vector3().copy(coche.position);
                lookAtPos.y += 1.6;
                camera.lookAt(lookAtPos);

                actualizarParticulas(delta);
            }
            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
