<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Buggy - Parte 1</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        
        /* INTERFAZ (HUD) */
        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; }
        .panel { background: rgba(0,0,0,0.5); color: white; padding: 10px 20px; border-radius: 10px; border: 3px solid white; text-shadow: 2px 2px 0 #000; }
        
        /* CONTROLES TÁCTILES ESTILO 3D */
        #controles { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        .btn-grupo { display: flex; gap: 10px; }
        .btn {
            width: 80px; height: 80px; border-radius: 20px; border: 4px solid; color: white;
            font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center;
            user-select: none; touch-action: manipulation; text-shadow: 1px 1px 0 #000;
        }
        .btn-izq { background-color: #d3c5b5; border-color: #a89b8c; box-shadow: 0 6px 0 #8c7f73; }
        .btn-freno { background-color: #f05a28; border-color: #b83d15; box-shadow: 0 6px 0 #8c2e10; }
        .btn-gas { background-color: #4CAF50; border-color: #2E7D32; box-shadow: 0 6px 0 #1B5E20; }
        .btn:active { box-shadow: 0 2px 0; transform: translateY(4px); }
    </style>
</head>
<body>

    <!-- Interfaz de Usuario -->
    <div id="hud">
        <div class="panel">PUESTO 1/6</div>
        <div class="panel">VUELTA 1/1</div>
    </div>

    <div id="controles">
        <div class="btn-grupo">
            <div class="btn btn-izq">◀</div>
            <div class="btn btn-izq">▶</div>
        </div>
        <div class="btn-grupo">
            <div class="btn btn-freno">FRENO</div>
            <div class="btn btn-gas">GAS</div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, reloj;
        // (Las variables del coche y polvo se usarán en la Parte 2)

        function init() {
            // 1. CONFIGURACIÓN BÁSICA Y NIEBLA
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 40, 150); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, -12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; // ACTIVAR SOMBRAS
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            reloj = new THREE.Clock();

            // 2. LUCES (Sol y Luz Ambiental)
            const sol = new THREE.DirectionalLight(0xfff5e6, 1.5);
            sol.position.set(30, 40, 20);
            sol.castShadow = true;
            sol.shadow.mapSize.width = 2048;
            sol.shadow.mapSize.height = 2048;
            sol.shadow.camera.near = 0.5;
            sol.shadow.camera.far = 150;
            sol.shadow.camera.left = -50;
            sol.shadow.camera.right = 50;
            sol.shadow.camera.top = 50;
            sol.shadow.camera.bottom = -50;
            scene.add(sol);

            const ambiente = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            scene.add(ambiente);

            // 3. CREAR PAISAJE
            crearEntorno();
            
            // (La Parte 2 se encargará de llamar a crearCoche() y animar)
        }

        function crearEntorno() {
            // --- SUELO DE ARENA CON TEXTURA ---
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d9b382'; ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 10000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#c49a66' : '#ebd1a8';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }
            const texturaArena = new THREE.CanvasTexture(canvas);
            texturaArena.wrapS = THREE.RepeatWrapping;
            texturaArena.wrapT = THREE.RepeatWrapping;
            texturaArena.repeat.set(50, 50);

            const geoSuelo = new THREE.PlaneGeometry(500, 500);
            const matSuelo = new THREE.MeshStandardMaterial({ map: texturaArena, roughness: 1 });
            const suelo = new THREE.Mesh(geoSuelo, matSuelo);
            suelo.rotation.x = -Math.PI / 2;
            suelo.receiveShadow = true; 
            scene.add(suelo);

            // --- AGUA ---
            const geoAgua = new THREE.PlaneGeometry(1000, 1000);
            const matAgua = new THREE.MeshStandardMaterial({ color: 0x0077be, transparent: true, opacity: 0.8, roughness: 0.1, metalness: 0.5 });
            const agua = new THREE.Mesh(geoAgua, matAgua);
            agua.rotation.x = -Math.PI / 2;
            agua.position.y = -0.5;
            agua.position.x = 50;
            scene.add(agua);

            // --- ROCAS (Montañas) ---
            const geoRoca = new THREE.DodecahedronGeometry(10, 0);
            const matRoca = new THREE.MeshStandardMaterial({ color: 0x6b705c, flatShading: true });
            for(let i=0; i<10; i++) {
                const roca = new THREE.Mesh(geoRoca, matRoca);
                roca.position.set((Math.random() - 0.5) * 100, 5, 60 + Math.random() * 20);
                roca.rotation.set(Math.random(), Math.random(), Math.random());
                roca.scale.set(1 + Math.random(), 1 + Math.random(), 1 + Math.random());
                roca.castShadow = true;
                roca.receiveShadow = true;
                scene.add(roca);
            }

            // --- PALMERAS ---
            const matTronco = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const matHoja = new THREE.MeshStandardMaterial({ color: 0x2e8b57, flatShading: true });
            
            for (let i = 0; i < 15; i++) {
                const palmera = new THREE.Group();
                
                const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 5), matTronco);
                tronco.position.y = 2.5;
                tronco.castShadow = true;
                palmera.add(tronco);

                for (let j = 0; j < 6; j++) {
                    const hoja = new THREE.Mesh(new THREE.ConeGeometry(1, 4, 4), matHoja);
                    hoja.position.y = 5;
                    hoja.rotation.z = Math.PI / 3;
                    hoja.rotation.y = (Math.PI * 2 / 6) * j;
                    hoja.position.x = Math.sin((Math.PI * 2 / 6) * j) * 1.5;
                    hoja.position.z = Math.cos((Math.PI * 2 / 6) * j) * 1.5;
                    hoja.rotation.x = Math.PI / 4;
                    hoja.castShadow = true;
                    palmera.add(hoja);
                }
                
                palmera.position.set((Math.random() - 0.5) * 100, 0, (Math.random() - 0.5) * 100);
                scene.add(palmera);
            }
        }

                // --- AQUÍ EMPIEZA LA PARTE 2 ---
        let coche, ruedas = [], polvo;
        let velocidad = 0;

        function crearCoche() {
            coche = new THREE.Group();

            // Carrocería
            const geoCuerpo = new THREE.BoxGeometry(3, 1, 4.5);
            const matCuerpo = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3, metalness: 0.2 });
            const cuerpo = new THREE.Mesh(geoCuerpo, matCuerpo);
            cuerpo.position.y = 1;
            cuerpo.castShadow = true;
            coche.add(cuerpo);

            // Cabina
            const geoCabina = new THREE.BoxGeometry(2, 1, 2);
            const matCabina = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const cabina = new THREE.Mesh(geoCabina, matCabina);
            cabina.position.set(0, 2, 0.5);
            cabina.castShadow = true;
            coche.add(cabina);

            // Ruedas
            const geoRueda = new THREE.CylinderGeometry(0.8, 0.8, 0.6, 16);
            const matRueda = new THREE.MeshStandardMaterial({ color: 0x111111 });
            
            const posicionesRuedas = [
                [-1.6, 0.8, 1.5], [1.6, 0.8, 1.5], // Delanteras
                [-1.6, 0.8, -1.5], [1.6, 0.8, -1.5] // Traseras
            ];

            posicionesRuedas.forEach(pos => {
                const rueda = new THREE.Mesh(geoRueda, matRueda);
                rueda.rotation.z = Math.PI / 2;
                rueda.position.set(pos[0], pos[1], pos[2]);
                rueda.castShadow = true;
                coche.add(rueda);
                ruedas.push(rueda);
            });

            scene.add(coche);
        }

        function crearPolvo() {
            const cantidad = 50;
            const geo = new THREE.BufferGeometry();
            const posiciones = new Float32Array(cantidad * 3);
            
            for(let i=0; i<cantidad*3; i+=3){
                posiciones[i] = 0;
                posiciones[i+1] = -10;
                posiciones[i+2] = 0;
            }
            
            geo.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
            
            const mat = new THREE.PointsMaterial({
                color: 0xe0c9a6,
                size: 0.8,
                transparent: true,
                opacity: 0.6,
                depthWrite: false
            });
            
            polvo = new THREE.Points(geo, mat);
            scene.add(polvo);
        }

        function actualizarPolvo() {
            if (velocidad > 0.05) {
                const posiciones = polvo.geometry.attributes.position.array;
                for (let i = 0; i < posiciones.length; i += 3) {
                    if (posiciones[i+1] < 0) {
                        posiciones[i] = coche.position.x + (Math.random() - 0.5) * 1.5;
                        posiciones[i+1] = 0.2;
                        posiciones[i+2] = coche.position.z - 2.5; 
                        break;
                    }
                }
                for (let i = 1; i < posiciones.length; i += 3) {
                    if (posiciones[i] > 0) {
                        posiciones[i] -= 0.05;
                    }
                }
                polvo.geometry.attributes.position.needsUpdate = true;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = reloj.getDelta();

            // Movimiento automático para probar las físicas
            velocidad = 15; 
            coche.position.z += velocidad * delta;
            
            // Rotar ruedas
            ruedas.forEach(r => r.rotation.x += velocidad * delta);

            // Seguir al coche con la cámara
            camera.position.x = coche.position.x;
            camera.position.z = coche.position.z - 12;
            camera.lookAt(coche.position.x, coche.position.y + 1, coche.position.z + 5);

            actualizarPolvo();

            renderer.render(scene, camera);
        }

        // --- ARRANQUE FINAL ---
        // Se llama a crearCoche y crearPolvo aquí, después de definirlos
        window.addEventListener('resize', onWindowResize);
        crearCoche(); 
        crearPolvo();
        animate(); 
        init(); // Inicializa el escenario de la Parte 1

    </script>
</body>
</html>
