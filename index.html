<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beach Buggy - Pro Móvil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Luckiest Guy', cursive; user-select: none; }
        canvas { display: block; }
        #hud-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .texto-hud { color: white; font-size: 22px; -webkit-text-stroke: 2px black; text-shadow: 3px 3px 0 #000; letter-spacing: 1px;}
        #barra-progreso { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 40%; height: 18px; background: rgba(0,0,0,0.5); border: 3px solid #fff; border-radius: 10px; display: flex; align-items: center; z-index: 10;}
        #barra-relleno { height: 100%; width: 15%; background: #00aaff; border-radius: 5px; }
        #controles { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; z-index: 10; }
        .panel-metal { background: linear-gradient(to bottom, #d0d0d0, #808080); border: 3px solid #333; border-radius: 12px; padding: 10px; box-shadow: inset 0 0 10px rgba(255,255,255,0.6), 0 6px 0 #222; display: flex; gap: 8px; position: relative; }
        .panel-metal::before { content: ''; position: absolute; bottom: 4px; left: 10px; right: 10px; height: 8px; background-image: radial-gradient(#555 30%, transparent 35%); background-size: 8px 8px; background-position: center; opacity: 0.7; }
        .btn { width: 55px; height: 55px; border-radius: 8px; background: linear-gradient(to bottom, #666, #333); border: 2px solid #111; box-shadow: inset 0 2px 5px rgba(255,255,255,0.3); color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn:active { box-shadow: inset 0 5px 10px rgba(0,0,0,0.8); transform: translateY(4px); }
        .item-slot { position: absolute; top: 90px; width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: radial-gradient(circle, #66ccff, #0066cc); box-shadow: 0 0 15px #00aaff, inset 0 0 10px #003366; z-index: 10; display: flex; justify-content: center; align-items: center; }
        .item-slot::after { content: ''; width: 35px; height: 35px; border-radius: 50%; background: radial-gradient(circle, #ffcc00, #ff3300); box-shadow: 0 0 10px #ff3300; border: 2px solid white; }
        #item-izq { left: 15px; }
        #item-der { right: 15px; background: radial-gradient(circle, #66ff66, #006600); box-shadow: 0 0 15px #00ff00, inset 0 0 10px #003300; }
        #item-der::after { background: radial-gradient(circle, #ccffff, #0066ff); box-shadow: 0 0 10px #00aaff; }
    </style>
</head>
<body>
    <div id="hud-top">
        <div class="texto-hud">PUESTO 6/6</div>
        <div id="barra-progreso"><div id="barra-relleno"></div></div>
        <div class="texto-hud">VUELTA 1/1</div>
    </div>
    <div id="item-izq" class="item-slot"></div>
    <div id="item-der" class="item-slot"></div>
    <div id="controles">
        <div class="panel-metal"><div class="btn">◀</div><div class="btn">▶</div></div>
        <div class="panel-metal">
            <div class="btn" style="font-size:12px; width:65px; background:linear-gradient(to bottom, #ff4444, #aa0000);">FRENO</div>
            <div class="btn" style="font-size:12px; width:65px; background:linear-gradient(to bottom, #44ff44, #00aa00);">GAS</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, reloj;
        let coche, ruedas = [], fuegoEscape;
        let velocidad = 0;
        let acelerando = true; 

        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // CONFIGURACIÓN DE COLOR PROFESIONAL SEGURA
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.outputEncoding = THREE.sRGBEncoding;
            
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            
            // --- TRUCO PRO: MAPA DE ENTORNO FALSO (Para que el metal brille y no sea negro) ---
            const canvasEnv = document.createElement('canvas');
            canvasEnv.width = 64; canvasEnv.height = 64;
            const ctxEnv = canvasEnv.getContext('2d');
            ctxEnv.fillStyle = '#87CEEB'; ctxEnv.fillRect(0, 0, 64, 32); // Cielo
            ctxEnv.fillStyle = '#e3c28d'; ctxEnv.fillRect(0, 32, 64, 32); // Suelo
            const envMap = new THREE.CanvasTexture(canvasEnv);
            envMap.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = envMap; // Esto ilumina los metales sin romper el celular

            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, -7.5); 
            reloj = new THREE.Clock();

            // LUCES
            const sol = new THREE.DirectionalLight(0xffffff, 2.0);
            sol.position.set(30, 50, -20);
            sol.castShadow = true;
            sol.shadow.mapSize.width = 1024;
            sol.shadow.mapSize.height = 1024;
            sol.shadow.camera.left = -50; sol.shadow.camera.right = 50; sol.shadow.camera.top = 50; sol.shadow.camera.bottom = -50;
            scene.add(sol);

            const ambiente = new THREE.HemisphereLight(0xffffff, 0x8b5a2b, 1.0);
            scene.add(ambiente);
                        crearEntorno(); 
            crearCochePro(); 
            crearFuegoEscape(); 

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function crearEntorno() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e3c28d'; ctx.fillRect(0, 0, 1024, 1024); 
            for (let i = 0; i < 50000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#d1ab70' : '#f0d5ab';
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
            }
            ctx.fillStyle = '#a87d4b';
            ctx.beginPath(); ctx.moveTo(412, 0); ctx.lineTo(612, 0); ctx.quadraticCurveTo(700, 512, 600, 1024); ctx.lineTo(424, 1024); ctx.quadraticCurveTo(324, 512, 412, 0); ctx.fill();
            
            const texturaSuelo = new THREE.CanvasTexture(canvas);
            texturaSuelo.wrapS = THREE.RepeatWrapping; texturaSuelo.wrapT = THREE.RepeatWrapping; texturaSuelo.repeat.set(15, 15);
            
            const suelo = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: texturaSuelo, roughness: 1.0, metalness: 0.0 }));
            suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);

            const matAgua = new THREE.MeshStandardMaterial({ color: 0x0088cc, transparent: true, opacity: 0.85, roughness: 0.1, metalness: 0.2 });
            const aguaIzq = new THREE.Mesh(new THREE.PlaneGeometry(400, 1000), matAgua);
            aguaIzq.rotation.x = -Math.PI / 2; aguaIzq.position.set(-300, -0.1, 0); scene.add(aguaIzq);
            const aguaDer = aguaIzq.clone(); aguaDer.position.x = 300; scene.add(aguaDer);
        }

        function crearCochePro() {
            coche = new THREE.Group();

            // --- 1. CHASIS (Rojo brillante) ---
            const matRojo = new THREE.MeshStandardMaterial({ color: 0xee0000, metalness: 0.4, roughness: 0.2 });
            const matBlanco = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.2, roughness: 0.3 });

            const chasis = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.8, 4.0), matRojo);
            chasis.position.y = 1.1; chasis.castShadow = true; chasis.receiveShadow = true; coche.add(chasis);

            const franja = new THREE.Mesh(new THREE.BoxGeometry(2.42, 0.82, 1.0), matBlanco);
            franja.position.set(0, 1.1, 1.5); coche.add(franja);

            // Número "01" (Textura)
            const canvasNum = document.createElement('canvas');
            canvasNum.width = 128; canvasNum.height = 128;
            const ctxN = canvasNum.getContext('2d');
            ctxN.fillStyle = '#ee0000'; ctxN.fillRect(0,0,128,128);
            ctxN.fillStyle = '#ffffff'; ctxN.font = 'bold 80px Arial'; ctxN.textAlign = 'center'; ctxN.textBaseline = 'middle';
            ctxN.fillText('01', 64, 64);
            const texNum = new THREE.CanvasTexture(canvasNum);
            
            const ladoIzq = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.6), new THREE.MeshBasicMaterial({map: texNum}));
            ladoIzq.position.set(-1.21, 1.1, 0); ladoIzq.rotation.y = -Math.PI/2; coche.add(ladoIzq);
            const ladoDer = ladoIzq.clone(); ladoDer.position.x = 1.21; ladoDer.rotation.y = Math.PI/2; coche.add(ladoDer);

            // --- 2. JAULA TUBULAR NEGRA (Metalizada) ---
            const matJaula = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.3 });
            const addTubo = (x, y, z, sx, sy, sz) => {
                const t = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, sy, 8), matJaula);
                t.position.set(x, y, z);
                if (sx > 0) t.rotation.z = Math.PI/2;
                if (sz > 0) t.rotation.x = Math.PI/2;
                t.castShadow = true; coche.add(t);
            };
            addTubo(-1.1, 2.1, -0.8, 0, 1.8, 0); addTubo(1.1, 2.1, -0.8, 0, 1.8, 0);
            addTubo(-1.1, 2.1, 0.8, 0, 1.8, 0);  addTubo(1.1, 2.1, 0.8, 0, 1.8, 0);
            addTubo(0, 3.0, -0.8, 2.2, 1, 0);    addTubo(0, 3.0, 0.8, 2.2, 1, 0);
            addTubo(-1.1, 3.0, 0, 1, 1, 1.6);    addTubo(1.1, 3.0, 0, 1, 1, 1.6);
            
            const defensa = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.08, 8, 16, Math.PI), matJaula);
            defensa.position.set(0, 1.1, 2.0); defensa.rotation.x = Math.PI/2; defensa.rotation.z = Math.PI; coche.add(defensa);

            // --- 3. SUSPENSIÓN ROJA ---
            const matAmortiguador = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.6, roughness: 0.2 });
            const posAmortiguadores = [[-1.2, 0.9, 1.2], [1.2, 0.9, 1.2], [-1.2, 0.9, -1.2], [1.2, 0.9, -1.2]];
            posAmortiguadores.forEach(pos => {
                const amort = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.0, 8), matAmortiguador);
                amort.position.set(pos[0], pos[1]+0.3, pos[2]); coche.add(amort);
            });

            // --- 4. FAROS DE TECHO ---
            const matFaros = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.0 });
            for(let i=0; i<4; i++){
                const faro = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.2, 12), matFaros);
                faro.rotation.x = Math.PI / 2; faro.position.set(-0.75 + i*0.5, 3.15, 0.85); coche.add(faro);
            }

            // --- 5. EL PILOTO (Con su cara y detalles) ---
            const piloto = new THREE.Group();
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.5), matRojo);
            torso.position.y = 2.0; torso.castShadow = true; piloto.add(torso);
            
            const franjaTraje = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.8, 0.1), matBlanco);
            franjaTraje.position.set(0, 2.0, 0); piloto.add(franjaTraje);
            const arnes = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.8, 0.52), new THREE.MeshStandardMaterial({color:0x111111, metalness:0.5}));
            arnes.position.set(0, 2.0, 0); piloto.add(arnes);

            // Brazos y guantes
            const brazoGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8);
            const brazoIzq = new THREE.Mesh(brazoGeo, matRojo);
            brazoIzq.position.set(-0.4, 2.1, 0.2); brazoIzq.rotation.x = Math.PI/3; piloto.add(brazoIzq);
            const guanteIzq = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshStandardMaterial({color:0x111111}));
            guanteIzq.position.set(-0.4, 1.9, 0.5); piloto.add(guanteIzq);
            const brazoDer = brazoIzq.clone(); brazoDer.position.x = 0.4; piloto.add(brazoDer);
            const guanteDer = guanteIzq.clone(); guanteDer.position.x = 0.4; piloto.add(guanteDer);

            // Casco brillante
            const casco = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), new THREE.MeshStandardMaterial({color: 0xee0000, metalness: 0.3, roughness: 0.1}));
            casco.position.y = 2.6; casco.castShadow = true; piloto.add(casco);
            const franjaCasco = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.82), matBlanco);
            franjaCasco.position.set(0, 2.6, 0); piloto.add(franjaCasco);

            // La Cara (Canvas)
            const canvasCara = document.createElement('canvas');
            canvasCara.width = 256; canvasCara.height = 256;
            const ctxF = canvasCara.getContext('2d');
            ctxF.fillStyle = '#ffcc99'; ctxF.fillRect(0,0,256,256);
            ctxF.fillStyle = '#ffffff'; ctxF.beginPath(); ctxF.arc(80, 128, 25, 0, Math.PI*2); ctxF.arc(176, 128, 25, 0, Math.PI*2); ctxF.fill();
            ctxF.fillStyle = '#4a2e15'; ctxF.beginPath(); ctxF.arc(80, 128, 15, 0, Math.PI*2); ctxF.arc(176, 128, 15, 0, Math.PI*2); ctxF.fill();
            ctxF.fillStyle = '#000000'; ctxF.beginPath(); ctxF.arc(80, 128, 8, 0, Math.PI*2); ctxF.arc(176, 128, 8, 0, Math.PI*2); ctxF.fill();
            ctxF.fillStyle = '#ffffff'; ctxF.beginPath(); ctxF.arc(75, 120, 4, 0, Math.PI*2); ctxF.arc(171, 120, 4, 0, Math.PI*2); ctxF.fill();
            ctxF.strokeStyle = '#4a2e15'; ctxF.lineWidth = 6; ctxF.lineCap = 'round';
            ctxF.beginPath(); ctxF.moveTo(55, 90); ctxF.lineTo(105, 100); ctxF.stroke();
            ctxF.beginPath(); ctxF.moveTo(201, 90); ctxF.lineTo(151, 100); ctxF.stroke();
            ctxF.beginPath(); ctxF.arc(128, 170, 25, 0, Math.PI); ctxF.stroke();

            const texturaCara = new THREE.CanvasTexture(canvasCara);
            const caraMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshBasicMaterial({map: texturaCara, transparent: true}));
            caraMesh.position.set(0, 2.6, 0.39); piloto.add(caraMesh);

            // Gafas brillantes
            const gafas = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.2), new THREE.MeshStandardMaterial({color:0x111111, metalness: 0.9, roughness: 0.1}));
            gafas.position.set(0, 2.85, 0.25); piloto.add(gafas);

            coche.add(piloto);

            // --- 6. RUEDAS OFF-ROAD ---
            const matGoma = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9, metalness: 0.0 });
            const matRin = new THREE.MeshStandardMaterial({ color: 0xee0000, metalness: 0.6, roughness: 0.2 });
            
            const posRuedas = [[-1.5, 0.9, 1.3], [1.5, 0.9, 1.3], [-1.5, 0.9, -1.3], [1.5, 0.9, -1.3]];
            posRuedas.forEach(pos => {
                const ruedaG = new THREE.Group();
                const llanta = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.7, 16), matGoma);
                llanta.rotation.z = Math.PI / 2; llanta.castShadow = true; ruedaG.add(llanta);
                const rin = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.72, 8), matRin);
                rin.rotation.z = Math.PI / 2; ruedaG.add(rin);
                for(let t=0; t<10; t++){
                    const taco = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.35, 0.75), matGoma);
                    taco.position.set(Math.cos(t*Math.PI/5)*0.85, Math.sin(t*Math.PI/5)*0.85, 0);
                    taco.rotation.z = t*Math.PI/5; ruedaG.add(taco);
                }
                ruedaG.position.set(pos[0], pos[1], pos[2]);
                coche.add(ruedaG); ruedas.push(ruedaG);
            });

            scene.add(coche);
        }

        function crearFuegoEscape() {
            const geo = new THREE.BufferGeometry();
            const posiciones = new Float32Array(100 * 3);
            const colores = new THREE.Float32BufferAttribute(new Float32Array(100 * 3), 3);
            for(let i=0; i<100*3; i+=3){
                posiciones[i] = 0; posiciones[i+1] = -10; posiciones[i+2] = 0;
                colores.setXYZ(i/3, 1.0, Math.random() * 0.5 + 0.5, 0);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
            geo.setAttribute('color', colores);
            const mat = new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
            fuegoEscape = new THREE.Points(geo, mat); scene.add(fuegoEscape);
        }

        function actualizarFuego(delta) {
            if (acelerando && velocidad > 0) {
                const pos = fuegoEscape.geometry.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    if (pos[i+1] < 0) {
                        pos[i] = coche.position.x + (Math.random() > 0.5 ? 0.5 : -0.5);
                        pos[i+1] = 1.2;
                        pos[i+2] = coche.position.z - 2.5; 
                        break;
                    }
                }
                for (let i = 1; i < pos.length; i += 3) {
                    if (pos[i] > 0) { pos[i] += delta * 2; pos[i+1] -= delta * 6; }
                }
                fuegoEscape.geometry.attributes.position.needsUpdate = true;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = reloj.getDelta();

            if (coche) {
                if (acelerando) { velocidad = THREE.MathUtils.lerp(velocidad, 30, delta * 1.5); } 
                else { velocidad = THREE.MathUtils.lerp(velocidad, 0, delta * 2); }

                const tiempo = Date.now() * 0.01;
                coche.position.y = Math.sin(tiempo * 8) * 0.03;
                coche.rotation.x = Math.sin(tiempo * 4) * 0.01;

                coche.position.z += velocidad * delta;
                ruedas.forEach(r => r.children[0].rotation.x += velocidad * delta * 1.2);

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, coche.position.x, 0.1);
                camera.position.z = coche.position.z - 8.0;
                camera.position.y = 4.5;
                camera.lookAt(coche.position.x, coche.position.y + 1.8, coche.position.z + 10);

                actualizarFuego(delta);
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
