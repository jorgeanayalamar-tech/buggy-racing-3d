<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beach Buggy - Piloto y Coche Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Luckiest Guy', cursive; user-select: none; }
        canvas { display: block; }

        /* --- HUD --- */
        #hud-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .texto-hud { color: white; font-size: 22px; -webkit-text-stroke: 2px black; text-shadow: 3px 3px 0 #000; letter-spacing: 1px;}
        #barra-progreso { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 35%; height: 18px; background: rgba(0,0,0,0.5); border: 3px solid #fff; border-radius: 10px; display: flex; align-items: center; z-index: 10;}
        #barra-relleno { height: 100%; width: 20%; background: #00aaff; border-radius: 5px; }
        #btn-pausa { position: absolute; top: 20px; right: 20px; width: 35px; height: 35px; background: radial-gradient(circle, #aaffff, #0088ff); border: 3px solid white; border-radius: 50%; z-index: 10; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 0 #004488; }
        #btn-pausa::before, #btn-pausa::after { content: ''; width: 5px; height: 14px; background: white; margin: 0 2px; border-radius: 2px; }
        
        /* --- CONTROLES --- */
        #controles { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; z-index: 10; }
        .panel-metal { background: linear-gradient(to bottom, #d0d0d0, #808080); border: 3px solid #333; border-radius: 12px; padding: 10px; box-shadow: inset 0 0 10px rgba(255,255,255,0.6), 0 6px 0 #222; display: flex; gap: 8px; position: relative; }
        .panel-metal::before { content: ''; position: absolute; bottom: 4px; left: 10px; right: 10px; height: 8px; background-image: radial-gradient(#555 30%, transparent 35%); background-size: 8px 8px; background-position: center; opacity: 0.7; }
        .btn { width: 55px; height: 55px; border-radius: 8px; background: linear-gradient(to bottom, #666, #333); border: 2px solid #111; box-shadow: inset 0 2px 5px rgba(255,255,255,0.3); color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn:active { box-shadow: inset 0 5px 10px rgba(0,0,0,0.8); transform: translateY(4px); }
        
        /* --- ITEMS --- */
        .item-slot { position: absolute; top: 90px; width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: radial-gradient(circle, #66ccff, #0066cc); box-shadow: 0 0 15px #00aaff, inset 0 0 10px #003366; z-index: 10; display: flex; justify-content: center; align-items: center; }
        .item-slot::after { content: ''; width: 35px; height: 35px; border-radius: 50%; background: radial-gradient(circle, #ffcc00, #ff3300); box-shadow: 0 0 10px #ff3300; border: 2px solid white; }
        #item-izq { left: 15px; }
        #item-der { right: 15px; background: radial-gradient(circle, #66ff66, #006600); box-shadow: 0 0 15px #00ff00, inset 0 0 10px #003300; }
        #item-der::after { background: radial-gradient(circle, #ccffff, #0066ff); box-shadow: 0 0 10px #00aaff; }
    </style>
</head>
<body>

    <div id="hud-top">
        <div class="texto-hud">PUESTO 6/6</div>
        <div id="barra-progreso"><div id="barra-relleno"></div></div>
        <div class="texto-hud">VUELTA 1/1</div>
    </div>
    <div id="btn-pausa"></div>
    <div id="item-izq" class="item-slot"></div>
    <div id="item-der" class="item-slot"></div>

    <div id="controles">
        <div class="panel-metal">
            <div class="btn">◀</div>
            <div class="btn">▶</div>
        </div>
        <div class="panel-metal">
            <div class="btn" style="font-size:12px; width:65px; background:linear-gradient(to bottom, #ff4444, #aa0000);">FRENO</div>
            <div class="btn" style="font-size:12px; width:65px; background:linear-gradient(to bottom, #44ff44, #00aa00);">GAS</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, reloj;
        let coche, ruedas = [], fuegoEscape;
        let velocidad = 0;
        let acelerando = true; 

        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0; 
            renderer.outputEncoding = THREE.sRGBEncoding; 
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            
            // CIELO MEJORADO (Azul más vivo)
            const canvasCielo = document.createElement('canvas');
            canvasCielo.width = 2; canvasCielo.height = 256;
            const ctxC = canvasCielo.getContext('2d');
            const grad = ctxC.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#0077ff'); 
            grad.addColorStop(1, '#87CEEB'); 
            ctxC.fillStyle = grad; ctxC.fillRect(0, 0, 2, 256);
            const texturaCielo = new THREE.CanvasTexture(canvasCielo);
            scene.background = texturaCielo;

            scene.fog = new THREE.FogExp2(0x87CEEB, 0.003);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, -8); // Cámara más pegada al coche
            reloj = new THREE.Clock();

            const sol = new THREE.DirectionalLight(0xffffff, 2.0);
            sol.position.set(30, 50, -20);
            sol.castShadow = true;
            sol.shadow.mapSize.width = 2048;
            sol.shadow.mapSize.height = 2048;
            sol.shadow.camera.left = -50;
            sol.shadow.camera.right = 50;
            sol.shadow.camera.top = 50;
            sol.shadow.camera.bottom = -50;
            scene.add(sol);

            const ambiente = new THREE.HemisphereLight(0xffffff, 0x44aa44, 1.5);
            scene.add(ambiente);
                        crearEntorno(); 
            crearCochePro(); // Nueva función con el coche detallado
            crearFuegoEscape(); 

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function crearEntorno() {
            // SUELO
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e3c28d'; ctx.fillRect(0, 0, 1024, 1024); 
            for (let i = 0; i < 50000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#d1ab70' : '#f0d5ab';
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
            }
            ctx.fillStyle = '#b38c58';
            ctx.beginPath(); ctx.moveTo(412, 0); ctx.lineTo(612, 0); ctx.quadraticCurveTo(700, 512, 600, 1024); ctx.lineTo(424, 1024); ctx.quadraticCurveTo(324, 512, 412, 0); ctx.fill();
            
            const texturaSuelo = new THREE.CanvasTexture(canvas);
            texturaSuelo.wrapS = THREE.RepeatWrapping; texturaSuelo.wrapT = THREE.RepeatWrapping; texturaSuelo.repeat.set(10, 10);
            const suelo = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: texturaSuelo, roughness: 1 }));
            suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);

            // AGUA Y MONTAÑAS
            const matAgua = new THREE.MeshStandardMaterial({ color: 0x0088cc, transparent: true, opacity: 0.9, roughness: 0.1, metalness: 0.3 });
            const aguaIzq = new THREE.Mesh(new THREE.PlaneGeometry(400, 1000), matAgua);
            aguaIzq.rotation.x = -Math.PI / 2; aguaIzq.position.set(-300, -0.2, 0); scene.add(aguaIzq);
            const aguaDer = aguaIzq.clone(); aguaDer.position.x = 300; scene.add(aguaDer);

            const matRoca = new THREE.MeshStandardMaterial({ color: 0x7a8471, flatShading: true, roughness: 0.9 });
            const matMusgo = new THREE.MeshStandardMaterial({ color: 0x4a5d23, flatShading: true, roughness: 0.9 });
            for(let i=0; i<20; i++) {
                const esIzq = i % 2 === 0;
                const roca = new THREE.Mesh(new THREE.DodecahedronGeometry(20 + Math.random() * 20, 1), Math.random() > 0.5 ? matRoca : matMusgo);
                roca.position.set(esIzq ? -80 - Math.random()*50 : 80 + Math.random()*50, 10, (Math.random() - 0.5) * 400);
                roca.rotation.set(Math.random(), Math.random(), Math.random()); roca.castShadow = true; roca.receiveShadow = true; scene.add(roca);
            }

            // PALMERAS
            const matTronco = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const matHoja = new THREE.MeshStandardMaterial({ color: 0x228b22, flatShading: true, side: THREE.DoubleSide });
            for (let i = 0; i < 30; i++) {
                const palmera = new THREE.Group();
                const puntos = []; for(let j=0; j<=4; j++) puntos.push(new THREE.Vector2(0.5 - j*0.1, j*2));
                const tronco = new THREE.Mesh(new THREE.LatheGeometry(puntos, 8), matTronco); tronco.castShadow = true; palmera.add(tronco);
                for (let j = 0; j < 8; j++) {
                    const hoja = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 6), matHoja);
                    hoja.position.y = 8; hoja.rotation.x = -Math.PI / 3; hoja.rotation.y = (Math.PI * 2 / 8) * j;
                    hoja.position.x = Math.sin((Math.PI * 2 / 8) * j) * 2; hoja.position.z = Math.cos((Math.PI * 2 / 8) * j) * 2;
                    hoja.castShadow = true; palmera.add(hoja);
                }
                const lado = Math.random() > 0.5 ? 1 : -1;
                palmera.position.set(lado * (20 + Math.random() * 40), 0, (Math.random() - 0.5) * 200); scene.add(palmera);
            }
        }

        function crearCochePro() {
            coche = new THREE.Group();

            // 1. CHASIS (Rojo con detalles blancos simulados con cajas)
            const geoChasis = new THREE.BoxGeometry(2.6, 1.0, 4.2);
            const matChasis = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3, metalness: 0.4 });
            const chasis = new THREE.Mesh(geoChasis, matChasis);
            chasis.position.y = 1.3; chasis.castShadow = true; coche.add(chasis);

            // Franjas blancas laterales
            const geoFranja = new THREE.BoxGeometry(0.1, 1.05, 2.5);
            const matBlanco = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const franjaIzq = new THREE.Mesh(geoFranja, matBlanco);
            franjaIzq.position.set(-1.31, 1.3, 0); coche.add(franjaIzq);
            const franjaDer = franjaIzq.clone(); franjaDer.position.x = 1.31; coche.add(franjaDer);

            // 2. JAULA ANTIVUELCO (Negra y cilíndrica)
            const matJaula = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4, metalness: 0.8 });
            const crearTubo = (x, y, z, rx, ry, rz, sx, sy, sz) => {
                const tubo = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), matJaula);
                tubo.position.set(x, y, z); tubo.rotation.set(rx, ry, rz); tubo.castShadow = true; coche.add(tubo);
            };
            // Pilares principales
            crearTubo(-1.2, 2.3, -0.6, 0, 0, 0, 0.15, 2.0, 0.15);
            crearTubo(1.2, 2.3, -0.6, 0, 0, 0, 0.15, 2.0, 0.15);
            crearTubo(-1.2, 2.3, 1.0, 0, 0, 0, 0.15, 2.0, 0.15);
            crearTubo(1.2, 2.3, 1.0, 0, 0, 0, 0.15, 2.0, 0.15);
            // Techo y travesaños
            crearTubo(0, 3.3, -0.6, 0, 0, 0, 2.5, 0.15, 0.15);
            crearTubo(0, 3.3, 1.0, 0, 0, 0, 2.5, 0.15, 0.15);
            crearTubo(-1.2, 3.3, 0.2, 0, 0, 0, 0.15, 0.15, 1.6);
            crearTubo(1.2, 3.3, 0.2, 0, 0, 0, 0.15, 0.15, 1.6);
            crearTubo(0, 2.8, 1.0, 0, 0, 0, 2.5, 0.1, 0.1); // Travesaño frontal

            // 3. FAROS EN EL TECHO (Detalle clave de la foto)
            const matFaros = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.5 });
            for(let i=0; i<4; i++){
                const faro = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3, 12), matFaros);
                faro.rotation.x = Math.PI / 2;
                faro.position.set(-0.8 + i*0.55, 3.5, 0.5);
                coche.add(faro);
            }

            // 4. SUSPENSIÓN Y BAJOS (Detalle rojo)
            const matSuspension = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.5, roughness: 0.5 });
            for(let i=0; i<4; i++){
                const susp = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.2, 8), matSuspension);
                susp.rotation.z = Math.PI / 2;
                // Posicionar cerca de las ruedas
                const x = (i % 2 === 0) ? -1.1 : 1.1;
                const z = (i < 2) ? 1.4 : -1.4;
                susp.position.set(x, 0.9, z);
                coche.add(susp);
            }

            // 5. EL PILOTO (Casco, Visor y Cuerpo)
            const piloto = new THREE.Group();
            piloto.position.set(0, 1.8, 0);

            // Cuerpo (Traje rojo)
            const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.6), new THREE.MeshStandardMaterial({color: 0xcc0000}));
            cuerpo.position.y = 0.45; cuerpo.castShadow = true; piloto.add(cuerpo);

            // Cabeza/Casco Base (Rojo)
            const casco = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshStandardMaterial({color: 0xcc0000, roughness: 0.1, metalness: 0.3}));
            casco.position.y = 1.2; casco.castShadow = true; piloto.add(casco);

            // Franja blanca del casco (Una caja curvada)
            const franjaCasco = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.9), new THREE.MeshStandardMaterial({color: 0xffffff}));
            franjaCasco.position.set(0, 1.25, 0); piloto.add(franjaCasco);

            // Visor Oscuro
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.25, 0.2), new THREE.MeshStandardMaterial({color: 0x111111, metalness: 0.9, roughness: 0.1}));
            visor.position.set(0, 1.25, 0.35); piloto.add(visor);

            coche.add(piloto);

            // 6. MOTOR Y ESCAPES
            const motor = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 1.0), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.5 }));
            motor.position.set(0, 1.5, -1.8); motor.castShadow = true; coche.add(motor);

            const geoEscape = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8);
            const matMetal = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });
            const escapeIzq = new THREE.Mesh(geoEscape, matMetal);
            escapeIzq.rotation.x = Math.PI / 2; escapeIzq.position.set(-0.6, 1.2, -2.4); coche.add(escapeIzq);
            const escapeDer = escapeIzq.clone(); escapeDer.position.x = 0.6; coche.add(escapeDer);

            // 7. RUEDAS GIGANTES (Monster Truck)
            const geoRueda = new THREE.CylinderGeometry(1.1, 1.1, 0.9, 24);
            const matRueda = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 1.0 });
            const matRin = new THREE.MeshStandardMaterial({ color: 0xaa0000, metalness: 0.6, roughness: 0.3 }); // Rin rojo
            
            const posiciones = [[-1.6, 1.1, 1.4], [1.6, 1.1, 1.4], [-1.6, 1.1, -1.4], [1.6, 1.1, -1.4]];
            posiciones.forEach(pos => {
                const ruedaGroup = new THREE.Group();
                const neumatico = new THREE.Mesh(geoRueda, matRueda);
                neumatico.rotation.z = Math.PI / 2; neumatico.castShadow = true; ruedaGroup.add(neumatico);
                
                const rin = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.92, 12), matRin);
                rin.rotation.z = Math.PI / 2; ruedaGroup.add(rin);
                
                ruedaGroup.position.set(pos[0], pos[1], pos[2]);
                coche.add(ruedaGroup); ruedas.push(ruedaGroup);
            });

            scene.add(coche);
        }

        function crearFuegoEscape() {
            const cantidad = 100;
            const geo = new THREE.BufferGeometry();
            const posiciones = new Float32Array(cantidad * 3);
            const colores = new Float32Array(cantidad * 3);
            for(let i=0; i<cantidad*3; i+=3){
                posiciones[i] = 0; posiciones[i+1] = -10; posiciones[i+2] = 0;
                colores[i] = 1.0; colores[i+1] = Math.random() * 0.5 + 0.5; colores[i+2] = 0;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colores, 3));
            const mat = new THREE.PointsMaterial({ size: 0.6, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending });
            fuegoEscape = new THREE.Points(geo, mat); scene.add(fuegoEscape);
        }

        function actualizarFuego(delta) {
            if (acelerando && velocidad > 0) {
                const posiciones = fuegoEscape.geometry.attributes.position.array;
                for (let i = 0; i < posiciones.length; i += 3) {
                    if (posiciones[i+1] < 0) {
                        posiciones[i] = coche.position.x + (Math.random() > 0.5 ? 0.6 : -0.6);
                        posiciones[i+1] = 1.2;
                        posiciones[i+2] = coche.position.z - 2.6; 
                        break;
                    }
                }
                for (let i = 1; i < posiciones.length; i += 3) {
                    if (posiciones[i] > 0) { posiciones[i] += delta * 2; posiciones[i+1] -= delta * 5; }
                }
                fuegoEscape.geometry.attributes.position.needsUpdate = true;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = reloj.getDelta();

            if (coche) {
                if (acelerando) { velocidad = THREE.MathUtils.lerp(velocidad, 25, delta * 2); } 
                else { velocidad = THREE.MathUtils.lerp(velocidad, 0, delta * 3); }

                // Vibración
                const tiempo = Date.now() * 0.005;
                coche.position.y = Math.sin(tiempo * 6) * 0.04;
                coche.rotation.z = Math.sin(tiempo * 4) * 0.01;

                coche.position.z += velocidad * delta;
                ruedas.forEach(r => r.children[0].rotation.x += velocidad * delta * 1.2);

                // Cámara (Pegada al coche para ver los detalles)
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, coche.position.x, 0.1);
                camera.position.z = coche.position.z - 8;
                camera.position.y = 4.5;
                camera.lookAt(coche.position.x, coche.position.y + 1.8, coche.position.z + 8);

                actualizarFuego(delta);
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
