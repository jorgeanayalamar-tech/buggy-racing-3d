<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beach Buggy - Calidad Render</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Luckiest Guy', cursive; user-select: none; }
        canvas { display: block; }
        #hud-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .texto-hud { color: white; font-size: 22px; -webkit-text-stroke: 2px black; text-shadow: 3px 3px 0 #000; letter-spacing: 1px;}
        #barra-progreso { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 40%; height: 18px; background: rgba(0,0,0,0.5); border: 3px solid #fff; border-radius: 10px; display: flex; align-items: center; z-index: 10;}
        #barra-relleno { height: 100%; width: 15%; background: #00aaff; border-radius: 5px; }
        #controles { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; z-index: 10; }
        .panel-metal { background: linear-gradient(to bottom, #d0d0d0, #808080); border: 3px solid #333; border-radius: 12px; padding: 10px; box-shadow: inset 0 0 10px rgba(255,255,255,0.6), 0 6px 0 #222; display: flex; gap: 8px; position: relative; }
        .panel-metal::before { content: ''; position: absolute; bottom: 4px; left: 10px; right: 10px; height: 8px; background-image: radial-gradient(#555 30%, transparent 35%); background-size: 8px 8px; background-position: center; opacity: 0.7; }
        .btn { width: 55px; height: 55px; border-radius: 8px; background: linear-gradient(to bottom, #666, #333); border: 2px solid #111; box-shadow: inset 0 2px 5px rgba(255,255,255,0.3); color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn:active { box-shadow: inset 0 5px 10px rgba(0,0,0,0.8); transform: translateY(4px); }
        .item-slot { position: absolute; top: 90px; width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: radial-gradient(circle, #66ccff, #0066cc); box-shadow: 0 0 15px #00aaff, inset 0 0 10px #003366; z-index: 10; display: flex; justify-content: center; align-items: center; }
        .item-slot::after { content: ''; width: 35px; height: 35px; border-radius: 50%; background: radial-gradient(circle, #ffcc00, #ff3300); box-shadow: 0 0 10px #ff3300; border: 2px solid white; }
        #item-izq { left: 15px; }
        #item-der { right: 15px; background: radial-gradient(circle, #66ff66, #006600); box-shadow: 0 0 15px #00ff00, inset 0 0 10px #003300; }
        #item-der::after { background: radial-gradient(circle, #ccffff, #0066ff); box-shadow: 0 0 10px #00aaff; }
    </style>
</head>
<body>
    <div id="hud-top">
        <div class="texto-hud">PUESTO 6/6</div>
        <div id="barra-progreso"><div id="barra-relleno"></div></div>
        <div class="texto-hud">VUELTA 1/1</div>
    </div>
    <div id="item-izq" class="item-slot"></div>
    <div id="item-der" class="item-slot"></div>
    <div id="controles">
        <div class="panel-metal"><div class="btn">◀</div><div class="btn">▶</div></div>
        <div class="panel-metal">
            <div class="btn" style="font-size:12px; width:65px; background:linear-gradient(to bottom, #ff4444, #aa0000);">FRENO</div>
            <div class="btn" style="font-size:12px; width:65px; background:linear-gradient(to bottom, #44ff44, #00aa00);">GAS</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, reloj;
        let coche, ruedas = [], fuegoEscape;
        let velocidad = 0;
        let acelerando = true; 

        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Configuración de color de alto nivel (Tone Mapping)
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.004);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, -8); 
            reloj = new THREE.Clock();

            // LUCES PROFESIONALES TIPO ESTUDIO
            const sol = new THREE.DirectionalLight(0xfff5e6, 3.0);
            sol.position.set(30, 50, -20);
            sol.castShadow = true;
            sol.shadow.mapSize.width = 2048;
            sol.shadow.mapSize.height = 2048;
            sol.shadow.camera.left = -50; sol.shadow.camera.right = 50; sol.shadow.camera.top = 50; sol.shadow.camera.bottom = -50;
            sol.shadow.bias = -0.0005;
            scene.add(sol);

            const ambiente = new THREE.HemisphereLight(0xffffff, 0x8b5a2b, 1.0);
            scene.add(ambiente);

            // --- GENERADOR DE REFLEJOS (PMREM) - Clave para el look de Blender ---
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            const envScene = new THREE.Scene();
            // Creamos un cielo simulado para que el metal tenga qué reflejar
            const envCanvas = document.createElement('canvas');
            envCanvas.width = 512; envCanvas.height = 512;
            const eCtx = envCanvas.getContext('2d');
            const eGrad = eCtx.createLinearGradient(0, 0, 0, 512);
            eGrad.addColorStop(0, '#ffffff'); // Luz cenital fuerte
            eGrad.addColorStop(0.5, '#87CEEB'); // Azul cielo
            eGrad.addColorStop(1, '#e3c28d'); // Arena
            eCtx.fillStyle = eGrad; eCtx.fillRect(0, 0, 512, 512);
            const envTexture = new THREE.CanvasTexture(envCanvas);
            envTexture.mapping = THREE.EquirectangularReflectionMapping;
            
            const envMap = pmremGenerator.fromEquirectangular(envTexture).texture;
            scene.environment = envMap; // Aplica los reflejos a todos los materiales metálicos
                    crearEntorno(); 
            crearCochePro(); 
            crearFuegoEscape(); 

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function crearEntorno() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e3c28d'; ctx.fillRect(0, 0, 1024, 1024); 
            for (let i = 0; i < 50000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#d1ab70' : '#f0d5ab';
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
            }
            ctx.fillStyle = '#a87d4b';
            ctx.beginPath(); ctx.moveTo(412, 0); ctx.lineTo(612, 0); ctx.quadraticCurveTo(700, 512, 600, 1024); ctx.lineTo(424, 1024); ctx.quadraticCurveTo(324, 512, 412, 0); ctx.fill();
            
            const texturaSuelo = new THREE.CanvasTexture(canvas);
            texturaSuelo.wrapS = THREE.RepeatWrapping; texturaSuelo.wrapT = THREE.RepeatWrapping; texturaSuelo.repeat.set(15, 15);
            const suelo = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: texturaSuelo, roughness: 1.0 }));
            suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);
        }

        function crearCochePro() {
            coche = new THREE.Group();

            // Materiales con brillo realista (Metalness alto + roughness bajo)
            const matRojo = new THREE.MeshStandardMaterial({ color: 0xd30000, metalness: 0.6, roughness: 0.2 });
            const matBlanco = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.3, roughness: 0.3 });
            const matNegro = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.4 });
            const matCromo = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 1.0, roughness: 0.1 });

            // 1. CHASIS CURVO (Usamos Esferas achatadas para que no sea una caja)
            const cuerpoGeo = new THREE.CapsuleGeometry(0.8, 2.5, 8, 16);
            const cuerpo = new THREE.Mesh(cuerpoGeo, matRojo);
            cuerpo.rotation.x = Math.PI / 2; cuerpo.rotation.z = Math.PI / 2;
            cuerpo.position.set(0, 1.2, 0); cuerpo.scale.set(1.5, 1, 0.6);
            cuerpo.castShadow = true; cuerpo.receiveShadow = true; coche.add(cuerpo);

            // 2. JAULA TUBULAR REAL (Usando curvas y tubos, no cajas)
            const puntosJaula = [
                new THREE.Vector3(-1, 1.5, -1.5), new THREE.Vector3(-1, 2.8, -1), new THREE.Vector3(-0.8, 3.0, 0.5), new THREE.Vector3(-0.8, 1.8, 1.5), // Lado izq
                new THREE.Vector3(0.8, 1.8, 1.5), new THREE.Vector3(0.8, 3.0, 0.5), new THREE.Vector3(1, 2.8, -1), new THREE.Vector3(1, 1.5, -1.5) // Lado der
            ];
            const curvaJaula = new THREE.CatmullRomCurve3(puntosJaula);
            const tuboJaula = new THREE.TubeGeometry(curvaJaula, 64, 0.08, 8, false);
            const jaula = new THREE.Mesh(tuboJaula, matNegro);
            jaula.castShadow = true; coche.add(jaula);

            // 3. EL PILOTO (Geometrías Suaves y Cara)
            const piloto = new THREE.Group();
            
            // Cuerpo (Cápsula suave)
            const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.4, 4, 16), matRojo);
            torso.position.y = 1.9; torso.castShadow = true; piloto.add(torso);
            
            // Casco Brillante
            const casco = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 32), matRojo);
            casco.position.y = 2.5; casco.castShadow = true; piloto.add(casco);
            
            // Franja blanca del casco
            const franjaCasco = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.9), matBlanco);
            franjaCasco.position.set(0, 2.5, 0); piloto.add(franjaCasco);

            // Visor Oscuro (Media esfera)
            const visor = new THREE.Mesh(new THREE.SphereGeometry(0.46, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.9, roughness: 0.0 }));
            visor.position.set(0, 2.5, 0.05); visor.rotation.x = Math.PI / 4; piloto.add(visor);

            // Gafas de sol en la frente (Tubo)
            const gafasGeo = new THREE.TorusGeometry(0.35, 0.08, 8, 16, Math.PI);
            const gafas = new THREE.Mesh(gafasGeo, matNegro);
            gafas.position.set(0, 2.8, 0.2); gafas.rotation.x = -Math.PI / 6; piloto.add(gafas);

            // La Cara (Canvas de alta resolución)
            const canvasCara = document.createElement('canvas');
            canvasCara.width = 512; canvasCara.height = 512;
            const ctxF = canvasCara.getContext('2d');
            ctxF.fillStyle = '#ffcc99'; ctxF.fillRect(0,0,512,512);
            // Ojos Anime Grandes
            ctxF.fillStyle = '#ffffff'; ctxF.beginPath(); ctxF.arc(160, 256, 50, 0, Math.PI*2); ctxF.arc(352, 256, 50, 0, Math.PI*2); ctxF.fill();
            ctxF.fillStyle = '#4a2e15'; ctxF.beginPath(); ctxF.arc(160, 256, 30, 0, Math.PI*2); ctxF.arc(352, 256, 30, 0, Math.PI*2); ctxF.fill();
            ctxF.fillStyle = '#000000'; ctxF.beginPath(); ctxF.arc(160, 256, 15, 0, Math.PI*2); ctxF.arc(352, 256, 15, 0, Math.PI*2); ctxF.fill();
            ctxF.fillStyle = '#ffffff'; ctxF.beginPath(); ctxF.arc(145, 235, 10, 0, Math.PI*2); ctxF.arc(337, 235, 10, 0, Math.PI*2); ctxF.fill();
            // Cejas y Sonrisa
            ctxF.strokeStyle = '#4a2e15'; ctxF.lineWidth = 12; ctxF.lineCap = 'round';
            ctxF.beginPath(); ctxF.moveTo(100, 180); ctxF.lineTo(200, 200); ctxF.stroke();
            ctxF.beginPath(); ctxF.moveTo(412, 180); ctxF.lineTo(312, 200); ctxF.stroke();
            ctxF.beginPath(); ctxF.arc(256, 340, 50, 0, Math.PI); ctxF.stroke();

            const texturaCara = new THREE.CanvasTexture(canvasCara);
            const caraMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.55), new THREE.MeshBasicMaterial({map: texturaCara, transparent: true}));
            caraMesh.position.set(0, 2.45, 0.4); piloto.add(caraMesh);

            coche.add(piloto);

            // 4. RUEDAS OFF-ROAD CON RELIEVE
            const matGoma = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9, metalness: 0.1 });
            const matRin = new THREE.MeshStandardMaterial({ color: 0xd30000, metalness: 0.8, roughness: 0.2 });
            
            const posRuedas = [[-1.3, 0.8, 1.2], [1.3, 0.8, 1.2], [-1.3, 0.8, -1.2], [1.3, 0.8, -1.2]];
            posRuedas.forEach(pos => {
                const ruedaG = new THREE.Group();
                // Llanta curva
                const llanta = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.6, 32), matGoma);
                llanta.rotation.z = Math.PI / 2; llanta.castShadow = true; ruedaG.add(llanta);
                // Rin metálico
                const rin = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.62, 16), matRin);
                rin.rotation.z = Math.PI / 2; ruedaG.add(rin);
                // Tacos de goma
                for(let t=0; t<12; t++){
                    const taco = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.65), matGoma);
                    taco.position.set(Math.cos(t*Math.PI/6)*0.8, Math.sin(t*Math.PI/6)*0.8, 0);
                    taco.rotation.z = t*Math.PI/6; ruedaG.add(taco);
                }
                ruedaG.position.set(pos[0], pos[1], pos[2]);
                coche.add(ruedaG); ruedas.push(ruedaG);
            });

            // 5. FAROS DE TECHO
            const matFaros = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.5 });
            for(let i=0; i<4; i++){
                const faro = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.2, 16), matFaros);
                faro.rotation.x = Math.PI / 2; faro.position.set(-0.6 + i*0.4, 3.0, 0.6); coche.add(faro);
            }

            scene.add(coche);
        }

        function crearFuegoEscape() {
            const geo = new THREE.BufferGeometry();
            const posiciones = new Float32Array(100 * 3);
            const colores = new THREE.Float32BufferAttribute(new Float32Array(100 * 3), 3);
            for(let i=0; i<100*3; i+=3){
                posiciones[i] = 0; posiciones[i+1] = -10; posiciones[i+2] = 0;
                colores.setXYZ(i/3, 1.0, Math.random() * 0.5 + 0.5, 0);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
            geo.setAttribute('color', colores);
            const mat = new THREE.PointsMaterial({ size: 0.4, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
            fuegoEscape = new THREE.Points(geo, mat); scene.add(fuegoEscape);
        }

        function actualizarFuego(delta) {
            if (acelerando && velocidad > 0) {
                const pos = fuegoEscape.geometry.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    if (pos[i+1] < 0) {
                        pos[i] = coche.position.x + (Math.random() > 0.5 ? 0.4 : -0.4);
                        pos[i+1] = 1.0;
                        pos[i+2] = coche.position.z - 2.0; 
                        break;
                    }
                }
                for (let i = 1; i < pos.length; i += 3) {
                    if (pos[i] > 0) { pos[i] += delta * 2; pos[i+1] -= delta * 6; }
                }
                fuegoEscape.geometry.attributes.position.needsUpdate = true;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = reloj.getDelta();

            if (coche) {
                if (acelerando) { velocidad = THREE.MathUtils.lerp(velocidad, 30, delta * 1.5); } 
                else { velocidad = THREE.MathUtils.lerp(velocidad, 0, delta * 2); }

                const tiempo = Date.now() * 0.01;
                coche.position.y = Math.sin(tiempo * 8) * 0.03;
                coche.rotation.x = Math.sin(tiempo * 4) * 0.01;

                coche.position.z += velocidad * delta;
                ruedas.forEach(r => r.children[0].rotation.x += velocidad * delta * 1.2);

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, coche.position.x, 0.1);
                camera.position.z = coche.position.z - 8.0;
                camera.position.y = 4.5;
                camera.lookAt(coche.position.x, coche.position.y + 1.8, coche.position.z + 10);

                actualizarFuego(delta);
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
