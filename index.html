<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beach Buggy - Proporciones Reales y Suaves</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Luckiest Guy', cursive; user-select: none; }
        canvas { display: block; }

        #hud-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .texto-hud { color: white; font-size: 24px; -webkit-text-stroke: 2px black; text-shadow: 3px 3px 0 #000; letter-spacing: 1px;}

        #barra-progreso { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); width: 40%; height: 22px; background: rgba(0,0,0,0.6); border: 4px solid #fff; border-radius: 12px; display: flex; align-items: center; z-index: 10; box-shadow: 0 4px 8px rgba(0,0,0,0.5);}
        #barra-relleno { height: 100%; width: 15%; background: linear-gradient(90deg, #00aaff, #00ffff); border-radius: 8px; }

        #btn-pausa { position: absolute; top: 20px; right: 20px; width: 45px; height: 45px; background: radial-gradient(circle, #ffffff, #0088ff); border: 4px solid #004488; border-radius: 50%; z-index: 10; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 0 #002244; cursor: pointer; }
        #btn-pausa::before, #btn-pausa::after { content: ''; width: 6px; height: 18px; background: #004488; margin: 0 3px; border-radius: 2px; }

        #controles { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 10; }
        .panel-metal { background: linear-gradient(to bottom, #e0e0e0, #808080); border: 4px solid #222; border-radius: 15px; padding: 12px; box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 8px 0 #111; display: flex; gap: 10px; position: relative; }
        .panel-metal::after { content: ''; position: absolute; bottom: 5px; left: 15px; right: 15px; height: 10px; background-image: radial-gradient(#444 40%, transparent 45%); background-size: 12px 12px; background-position: center; opacity: 0.8; }
        .btn { width: 65px; height: 65px; border-radius: 12px; background: linear-gradient(to bottom, #777, #333); border: 3px solid #111; box-shadow: inset 0 3px 5px rgba(255,255,255,0.4), inset 0 -3px 5px rgba(0,0,0,0.6); color: white; font-size: 26px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-family: 'Luckiest Guy', cursive; text-shadow: 2px 2px 0 #000; }
        .btn:active { box-shadow: inset 0 6px 10px rgba(0,0,0,0.8); transform: translateY(5px); }
        .btn-accion { width: 75px; font-size: 16px; }
        #btn-freno { background: linear-gradient(to bottom, #ff5555, #aa0000); }
        #btn-gas { background: linear-gradient(to bottom, #55ff55, #008800); }

        .item-slot { position: absolute; top: 100px; width: 80px; height: 80px; border-radius: 50%; border: 5px solid #fff; background: radial-gradient(circle, #88ddff, #0055aa); box-shadow: 0 0 20px #00aaff, inset 0 0 15px #003366; z-index: 10; display: flex; justify-content: center; align-items: center; }
        .item-slot::after { content: ''; width: 45px; height: 45px; border-radius: 50%; background: radial-gradient(circle, #ffff00, #ff0000); box-shadow: 0 0 15px #ff0000; border: 3px solid #fff; }
        #item-izq { left: 20px; }
        #item-der { right: 20px; background: radial-gradient(circle, #88ff88, #006600); box-shadow: 0 0 20px #00ff00, inset 0 0 15px #003300; }
        #item-der::after { background: radial-gradient(circle, #ffffff, #0088ff); box-shadow: 0 0 15px #00aaff; }
    </style>
</head>
<body>
    <div id="hud-top"><div class="texto-hud" id="txt-puesto">PUESTO 6/6</div><div class="texto-hud" id="txt-vuelta">VUELTA 1/1</div></div>
    <div id="barra-progreso"><div id="barra-relleno"></div></div>
    <div id="btn-pausa"></div>
    <div id="item-izq" class="item-slot"></div>
    <div id="item-der" class="item-slot"></div>
    <div id="controles">
        <div class="panel-metal"><div class="btn" id="btn-izq">◀</div><div class="btn" id="btn-der">▶</div></div>
        <div class="panel-metal"><div class="btn btn-accion" id="btn-freno">FRENO</div><div class="btn btn-accion" id="btn-gas">GAS</div></div>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
        <script>
        let scene, camera, renderer, reloj;
        let coche, ruedas = [], sistemaEscape, sistemaPolvo;
        let velocidad = 0, direccion = 0, acelerando = false, frenando = false, tiempoGlobal = 0;
        const VELOCIDAD_MAXIMA = 38, ACELERACION = 18, FRENADO = 30, VELOCIDAD_GIRO = 1.8;
        const RADIO_RUEDA = 0.66;

        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.004);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, -9);
            reloj = new THREE.Clock();

            const sol = new THREE.DirectionalLight(0xfff5e6, 3.0);
            sol.position.set(40, 60, -30);
            sol.castShadow = true;
            sol.shadow.mapSize.width = 2048; sol.shadow.mapSize.height = 2048;
            sol.shadow.camera.left = -60; sol.shadow.camera.right = 60; sol.shadow.camera.top = 60; sol.shadow.camera.bottom = -60;
            sol.shadow.bias = -0.0005;
            scene.add(sol);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            scene.add(new THREE.HemisphereLight(0xffffff, 0x8b5a2b, 1.2));

            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            const envCanvas = document.createElement('canvas');
            envCanvas.width = 512; envCanvas.height = 512;
            const eCtx = envCanvas.getContext('2d');
            const eGrad = eCtx.createLinearGradient(0, 0, 0, 512);
            eGrad.addColorStop(0, '#ffffff'); eGrad.addColorStop(0.5, '#87CEEB'); eGrad.addColorStop(1, '#e3c28d');
            eCtx.fillStyle = eGrad; eCtx.fillRect(0, 0, 512, 512);
            const envTexture = new THREE.CanvasTexture(envCanvas);
            envTexture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = pmremGenerator.fromEquirectangular(envTexture).texture;

            crearEntorno();
            crearCoche();
            crearSistemasParticulas();
            configurarControles();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

                    function crearEntorno() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e3c28d'; ctx.fillRect(0, 0, 1024, 1024);
            for (let i = 0; i < 80000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#d1ab70' : '#f0d5ab';
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
            }
            ctx.fillStyle = '#a87d4b';
            ctx.beginPath(); ctx.moveTo(412, 0); ctx.lineTo(612, 0); ctx.quadraticCurveTo(700, 512, 600, 1024); ctx.lineTo(424, 1024); ctx.quadraticCurveTo(324, 512, 412, 0); ctx.fill();

            const texturaSuelo = new THREE.CanvasTexture(canvas);
            texturaSuelo.wrapS = THREE.RepeatWrapping; texturaSuelo.wrapT = THREE.RepeatWrapping; texturaSuelo.repeat.set(20, 20);
            const suelo = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: texturaSuelo, roughness: 1.0, metalness: 0.0 }));
            suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);

            const matRoca = new THREE.MeshStandardMaterial({ color: 0x7a8471, flatShading: true, roughness: 0.9 });
            for (let i = 0; i < 20; i++) {
                const esIzq = i % 2 === 0;
                const roca = new THREE.Mesh(new THREE.DodecahedronGeometry(20 + Math.random() * 30, 1), matRoca);
                roca.position.set(esIzq ? -100 - Math.random() * 80 : 100 + Math.random() * 80, 10, (Math.random() - 0.5) * 500);
                roca.rotation.set(Math.random(), Math.random(), Math.random());
                roca.castShadow = true; roca.receiveShadow = true; scene.add(roca);
            }
        }
                    function crearCoche() {
            const M = crearMateriales();
            coche = new THREE.Group();

            // 1. CARROCERÍA: perfil suave extruido a lo ancho del coche
            const perfil = new THREE.Shape();
            perfil.moveTo(-2.0, 0.7);
            perfil.lineTo(2.1, 0.7);
            perfil.quadraticCurveTo(2.5, 0.8, 2.4, 1.2);
            perfil.quadraticCurveTo(2.2, 1.5, 1.4, 1.5);
            perfil.lineTo(-1.2, 1.5);
            perfil.quadraticCurveTo(-2.1, 1.4, -2.2, 1.0);
            perfil.quadraticCurveTo(-2.2, 0.7, -2.0, 0.7);

            const geoCarroceria = new THREE.ExtrudeGeometry(perfil, {
                depth: 1.7, bevelEnabled: true, bevelSegments: 6, steps: 1,
                bevelSize: 0.15, bevelThickness: 0.15, curveSegments: 24
            });
            geoCarroceria.rotateY(-Math.PI / 2);
            geoCarroceria.center();
            const carroceria = new THREE.Mesh(geoCarroceria, M.rojo);
            carroceria.position.y = 1.1;
            carroceria.castShadow = true; carroceria.receiveShadow = true;
            coche.add(carroceria);

            // 2. LLAMAS EN EL CAPÓ (textura con fondo transparente)
            const lienzoLlamas = document.createElement('canvas');
            lienzoLlamas.width = 512; lienzoLlamas.height = 512;
            const gl = lienzoLlamas.getContext('2d');
            for (let capa = 0; capa < 2; capa++) {
                gl.fillStyle = capa === 0 ? '#ffd400' : '#ff7a00';
                const escala = capa === 0 ? 1 : 0.6;
                for (let i = 0; i < 6; i++) {
                    const x = 60 + i * 80;
                    const base = 512 - (capa === 0 ? 0 : 120);
                    const punta = (i % 2 === 0 ? 40 : 110) + (capa === 0 ? 0 : 80);
                    gl.beginPath();
                    gl.moveTo(x - 40 * escala, base);
                    gl.quadraticCurveTo(x - 30 * escala, base - 200, x, punta);
                    gl.quadraticCurveTo(x + 30 * escala, base - 200, x + 40 * escala, base);
                    gl.closePath();
                    gl.fill();
                }
            }
            const decalLlamas = new THREE.Mesh(
                new THREE.PlaneGeometry(1.2, 1.4),
                new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(lienzoLlamas), transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1 })
            );
            decalLlamas.rotation.x = -Math.PI / 2;
            decalLlamas.position.set(0, 1.53, 0.4);
            coche.add(decalLlamas);

            // 3. NÚMERO "01" EN LOS LATERALES
            const lienzoNum = document.createElement('canvas');
            lienzoNum.width = 512; lienzoNum.height = 256;
            const gn = lienzoNum.getContext('2d');
            gn.fillStyle = '#ffffff'; gn.beginPath(); gn.arc(256, 128, 110, 0, Math.PI * 2); gn.fill();
            gn.fillStyle = '#d30000'; gn.font = 'bold 150px Arial';
            gn.textAlign = 'center'; gn.textBaseline = 'middle'; gn.fillText('01', 256, 136);
            const matNum = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(lienzoNum), transparent: true, polygonOffset: true, polygonOffsetFactor: -1 });
            const numIzq = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.4), matNum);
            numIzq.position.set(-1.02, 1.15, -0.2); numIzq.rotation.y = -Math.PI / 2;
            const numDer = numIzq.clone();
            numDer.position.x = 1.02; numDer.rotation.y = Math.PI / 2;
            coche.add(numIzq, numDer);

            // 4. ASIENTO Y PILOTO
            const asiento = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.7), M.negro);
            asiento.position.set(0, 1.85, -0.5); asiento.castShadow = true; coche.add(asiento);
            const respaldo = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.2), M.negro);
            respaldo.position.set(0, 2.1, -0.85); coche.add(respaldo);

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.7, 16), M.rojo);
            torso.position.set(0, 2.25, -0.45); torso.castShadow = true; coche.add(torso);

            const cabeza = new THREE.Group();
            cabeza.position.set(0, 2.85, -0.35);
            const cara = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), M.piel);
            cara.castShadow = true; cabeza.add(cara);
            const casco = new THREE.Mesh(new THREE.SphereGeometry(0.34, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), M.rojo);
            casco.position.y = 0.06; casco.castShadow = true; cabeza.add(casco);
            const franjaCasco = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.6), M.blanco);
            franjaCasco.position.set(0, 0.36, -0.02); cabeza.add(franjaCasco);
            [-0.1, 0.1].forEach(x => {
                const ojo = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), M.negro);
                ojo.position.set(x, -0.02, 0.28); cabeza.add(ojo);
                const gafa = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.025, 8, 16), M.negro);
                gafa.position.set(x, -0.02, 0.27); cabeza.add(gafa);
            });
            coche.add(cabeza);

            // Brazos hasta el volante
            coche.add(cilindroEntre(new THREE.Vector3(-0.32, 2.45, -0.35), new THREE.Vector3(-0.28, 2.2, 0.12), 0.08, M.rojo));
            coche.add(cilindroEntre(new THREE.Vector3(0.32, 2.45, -0.35), new THREE.Vector3(0.28, 2.2, 0.12), 0.08, M.rojo));

            const volante = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.035, 8, 20), M.negro);
            volante.position.set(0, 2.4, 0.2); volante.rotation.x = -Math.PI / 3;
            coche.add(volante);

            // 5. JAULA ANTIVUELCO (arcos laterales y travesaños)
            [-1, 1].forEach(s => {
                coche.add(tubo([
                    new THREE.Vector3(s * 0.9, 1.55, 1.0),
                    new THREE.Vector3(s * 0.9, 2.4, 0.4),
                    new THREE.Vector3(s * 0.9, 3.0, -0.1),
                    new THREE.Vector3(s * 0.9, 3.05, -0.7),
                    new THREE.Vector3(s * 0.9, 2.4, -1.2),
                    new THREE.Vector3(s * 0.9, 1.5, -1.35)
                ], 0.07, M.negro));
            });
            coche.add(tubo([
                new THREE.Vector3(-0.9, 3.0, -0.1),
                new THREE.Vector3(0, 3.12, -0.1),
                new THREE.Vector3(0.9, 3.0, -0.1)
            ], 0.06, M.negro));
            coche.add(cilindroEntre(new THREE.Vector3(-0.9, 3.05, -0.7), new THREE.Vector3(0.9, 3.05, -0.7), 0.06, M.negro));

            // Resorte en la parte trasera
            const espiral = [];
            for (let i = 0; i <= 16; i++) {
                const a = i * 1.0;
                espiral.push(new THREE.Vector3(Math.cos(a) * 0.05, i * 0.025, Math.sin(a) * 0.05));
            }
            const resorte = tubo(espiral, 0.02, M.cromo);
            resorte.position.set(0, 3.1, -1.0);
            coche.add(resorte);

        function crearMateriales() {
            return {
                rojo: new THREE.MeshStandardMaterial({ color: 0xe00000, metalness: 0.35, roughness: 0.35 }),
                blanco: new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.1, roughness: 0.4 }),
                negro: new THREE.MeshStandardMaterial({ color: 0x151515, metalness: 0.3, roughness: 0.5 }),
                goma: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95 }),
                cromo: new THREE.MeshStandardMaterial({ color: 0xe6e6e6, metalness: 1.0, roughness: 0.15 }),
                plata: new THREE.MeshStandardMaterial({ color: 0xc9d1d6, metalness: 0.8, roughness: 0.25 }),
                piel: new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.6 }),
                amarillo: new THREE.MeshStandardMaterial({ color: 0xffd400, emissive: 0xff8800, emissiveIntensity: 0.3 })
            };
        }

        // Tubo curvo que sigue una lista de puntos (jaula, resorte)
        function tubo(puntos, radio, material) {
            const curva = new THREE.CatmullRomCurve3(puntos);
            const malla = new THREE.Mesh(new THREE.TubeGeometry(curva, 48, radio, 12, false), material);
            malla.castShadow = true;
            return malla;
        }

        // Cilindro que une dos puntos (barras, escapes, brazos)
        function cilindroEntre(a, b, radio, material) {
            const dir = new THREE.Vector3().subVectors(b, a);
            const largo = dir.length();
            const malla = new THREE.Mesh(new THREE.CylinderGeometry(radio, radio, largo, 12), material);
            malla.position.copy(a).add(b).multiplyScalar(0.5);
            malla.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
            malla.castShadow = true;
            return malla;
            }
                                function crearCoche() {
            const M = crearMateriales();
            coche = new THREE.Group();

            // 1. CARROCERÍA: perfil suave extruido a lo ancho del coche
            const perfil = new THREE.Shape();
            perfil.moveTo(-2.0, 0.7);
            perfil.lineTo(2.1, 0.7);
            perfil.quadraticCurveTo(2.5, 0.8, 2.4, 1.2);
            perfil.quadraticCurveTo(2.2, 1.5, 1.4, 1.5);
            perfil.lineTo(-1.2, 1.5);
            perfil.quadraticCurveTo(-2.1, 1.4, -2.2, 1.0);
            perfil.quadraticCurveTo(-2.2, 0.7, -2.0, 0.7);

            const geoCarroceria = new THREE.ExtrudeGeometry(perfil, {
                depth: 1.7, bevelEnabled: true, bevelSegments: 6, steps: 1,
                bevelSize: 0.15, bevelThickness: 0.15, curveSegments: 24
            });
            geoCarroceria.rotateY(-Math.PI / 2);
            geoCarroceria.center();
            const carroceria = new THREE.Mesh(geoCarroceria, M.rojo);
            carroceria.position.y = 1.1;
            carroceria.castShadow = true; carroceria.receiveShadow = true;
            coche.add(carroceria);

            // 2. LLAMAS EN EL CAPÓ (textura con fondo transparente)
            const lienzoLlamas = document.createElement('canvas');
            lienzoLlamas.width = 512; lienzoLlamas.height = 512;
            const gl = lienzoLlamas.getContext('2d');
            for (let capa = 0; capa < 2; capa++) {
                gl.fillStyle = capa === 0 ? '#ffd400' : '#ff7a00';
                const escala = capa === 0 ? 1 : 0.6;
                for (let i = 0; i < 6; i++) {
                    const x = 60 + i * 80;
                    const base = 512 - (capa === 0 ? 0 : 120);
                    const punta = (i % 2 === 0 ? 40 : 110) + (capa === 0 ? 0 : 80);
                    gl.beginPath();
                    gl.moveTo(x - 40 * escala, base);
                    gl.quadraticCurveTo(x - 30 * escala, base - 200, x, punta);
                    gl.quadraticCurveTo(x + 30 * escala, base - 200, x + 40 * escala, base);
                    gl.closePath();
                    gl.fill();
                }
            }
            const decalLlamas = new THREE.Mesh(
                new THREE.PlaneGeometry(1.2, 1.4),
                new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(lienzoLlamas), transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1 })
            );
            decalLlamas.rotation.x = -Math.PI / 2;
            decalLlamas.position.set(0, 1.53, 0.4);
            coche.add(decalLlamas);

            // 3. NÚMERO "01" EN LOS LATERALES
            const lienzoNum = document.createElement('canvas');
            lienzoNum.width = 512; lienzoNum.height = 256;
            const gn = lienzoNum.getContext('2d');
            gn.fillStyle = '#ffffff'; gn.beginPath(); gn.arc(256, 128, 110, 0, Math.PI * 2); gn.fill();
            gn.fillStyle = '#d30000'; gn.font = 'bold 150px Arial';
            gn.textAlign = 'center'; gn.textBaseline = 'middle'; gn.fillText('01', 256, 136);
            const matNum = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(lienzoNum), transparent: true, polygonOffset: true, polygonOffsetFactor: -1 });
            const numIzq = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.4), matNum);
            numIzq.position.set(-1.02, 1.15, -0.2); numIzq.rotation.y = -Math.PI / 2;
            const numDer = numIzq.clone();
            numDer.position.x = 1.02; numDer.rotation.y = Math.PI / 2;
            coche.add(numIzq, numDer);

            // 4. ASIENTO Y PILOTO
            const asiento = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.7), M.negro);
            asiento.position.set(0, 1.85, -0.5); asiento.castShadow = true; coche.add(asiento);
            const respaldo = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.2), M.negro);
            respaldo.position.set(0, 2.1, -0.85); coche.add(respaldo);

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.7, 16), M.rojo);
            torso.position.set(0, 2.25, -0.45); torso.castShadow = true; coche.add(torso);

            const cabeza = new THREE.Group();
            cabeza.position.set(0, 2.85, -0.35);
            const cara = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), M.piel);
            cara.castShadow = true; cabeza.add(cara);
            const casco = new THREE.Mesh(new THREE.SphereGeometry(0.34, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), M.rojo);
            casco.position.y = 0.06; casco.castShadow = true; cabeza.add(casco);
            const franjaCasco = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.6), M.blanco);
            franjaCasco.position.set(0, 0.36, -0.02); cabeza.add(franjaCasco);
            [-0.1, 0.1].forEach(x => {
                const ojo = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), M.negro);
                ojo.position.set(x, -0.02, 0.28); cabeza.add(ojo);
                const gafa = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.025, 8, 16), M.negro);
                gafa.position.set(x, -0.02, 0.27); cabeza.add(gafa);
            });
            coche.add(cabeza);

            // Brazos hasta el volante
            coche.add(cilindroEntre(new THREE.Vector3(-0.32, 2.45, -0.35), new THREE.Vector3(-0.28, 2.2, 0.12), 0.08, M.rojo));
            coche.add(cilindroEntre(new THREE.Vector3(0.32, 2.45, -0.35), new THREE.Vector3(0.28, 2.2, 0.12), 0.08, M.rojo));

            const volante = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.035, 8, 20), M.negro);
            volante.position.set(0, 2.4, 0.2); volante.rotation.x = -Math.PI / 3;
            coche.add(volante);

            // 5. JAULA ANTIVUELCO (arcos laterales y travesaños)
            [-1, 1].forEach(s => {
                coche.add(tubo([
                    new THREE.Vector3(s * 0.9, 1.55, 1.0),
                    new THREE.Vector3(s * 0.9, 2.4, 0.4),
                    new THREE.Vector3(s * 0.9, 3.0, -0.1),
                    new THREE.Vector3(s * 0.9, 3.05, -0.7),
                    new THREE.Vector3(s * 0.9, 2.4, -1.2),
                    new THREE.Vector3(s * 0.9, 1.5, -1.35)
                ], 0.07, M.negro));
            });
            coche.add(tubo([
                new THREE.Vector3(-0.9, 3.0, -0.1),
                new THREE.Vector3(0, 3.12, -0.1),
                new THREE.Vector3(0.9, 3.0, -0.1)
            ], 0.06, M.negro));
            coche.add(cilindroEntre(new THREE.Vector3(-0.9, 3.05, -0.7), new THREE.Vector3(0.9, 3.05, -0.7), 0.06, M.negro));

            // Resorte en la parte trasera
            const espiral = [];
            for (let i = 0; i <= 16; i++) {
                const a = i * 1.0;
                espiral.push(new THREE.Vector3(Math.cos(a) * 0.05, i * 0.025, Math.sin(a) * 0.05));
            }
            const resorte = tubo(espiral, 0.02, M.cromo);
            resorte.position.set(0, 3.1, -1.0);
            coche.add(resorte);
                                                // 6. MOTOR, ESCAPES Y FRONTAL
            const motor = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.6, 0.8), M.negro);
            motor.position.set(0, 1.8, -1.75); motor.castShadow = true; coche.add(motor);
            coche.add(cilindroEntre(new THREE.Vector3(-0.35, 0.95, -2.1), new THREE.Vector3(-0.45, 1.2, -2.9), 0.09, M.cromo));
            coche.add(cilindroEntre(new THREE.Vector3(0.35, 0.95, -2.1), new THREE.Vector3(0.45, 1.2, -2.9), 0.09, M.cromo));

            coche.add(cilindroEntre(new THREE.Vector3(-0.95, 0.85, 2.35), new THREE.Vector3(0.95, 0.85, 2.35), 0.07, M.negro));
            [-0.6, 0.6].forEach(x => {
                const faro = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), M.amarillo);
                faro.position.set(x, 1.2, 2.45); coche.add(faro);
            });

            crearRuedas();
            scene.add(coche);
        }

        // 7. RUEDAS: orientación (dirección) > giro (rodadura)
        function crearRuedas() {
            const M = crearMateriales();
            const posiciones = [
                { x: -1.1, z: 1.4, delantera: true },
                { x: 1.1, z: 1.4, delantera: true },
                { x: -1.1, z: -1.4, delantera: false },
                { x: 1.1, z: -1.4, delantera: false }
            ];

            posiciones.forEach(p => {
                const orientacion = new THREE.Group();
                orientacion.position.set(p.x, 0.8, p.z);
                const giro = new THREE.Group();
                orientacion.add(giro);

                // Neumático
                const neumatico = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.24, 16, 32), M.goma);
                neumatico.rotation.y = Math.PI / 2; neumatico.castShadow = true;
                giro.add(neumatico);

                // Llanta
                const llanta = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.44, 32), M.plata);
                llanta.rotation.z = Math.PI / 2;
                giro.add(llanta);

                // Radios
                for (let r = 0; r < 5; r++) {
                    const radio = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.6, 0.08), M.plata);
                    radio.position.x = 0.27;
                    radio.rotation.x = (r * Math.PI * 2) / 5;
                    giro.add(radio);
                }

                // Tapacubos
                const tapacubos = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.1, 16), M.cromo);
                tapacubos.rotation.z = Math.PI / 2; tapacubos.position.x = 0.3;
                giro.add(tapacubos);

                coche.add(orientacion);
                ruedas.push({ orientacion, giro, delantera: p.delantera });

                // Guardabarros en arco sobre cada rueda
                const guardabarros = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.12, 12, 24, Math.PI), M.rojo);
                guardabarros.rotation.y = Math.PI / 2;
                guardabarros.position.set(p.x, 0.8, p.z);
                guardabarros.castShadow = true;
                coche.add(guardabarros);
            });
        }

        // 8. SISTEMA DE PARTÍCULAS (escape y polvo)
        function crearSistemaParticulas(cantidad, color, tamaño, opacidad) {
            const geo = new THREE.BufferGeometry();
            const posiciones = new Float32Array(cantidad * 3);
            for (let i = 0; i < cantidad; i++) posiciones[i * 3 + 1] = -100;
            geo.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
            const material = new THREE.PointsMaterial({ size: tamaño, color: color, transparent: true, opacity: opacidad, depthWrite: false });
            const puntos = new THREE.Points(geo, material);
            scene.add(puntos);
            return {
                geo, posiciones, cantidad, puntos,
                velocidades: new Float32Array(cantidad * 3),
                vidas: new Float32Array(cantidad),
                siguiente: 0
            };
        }

        function crearSistemasParticulas() {
            sistemaEscape = crearSistemaParticulas(200, 0xdddddd, 0.5, 0.7);
            sistemaPolvo = crearSistemaParticulas(150, 0xd1ab70, 1.0, 0.6);
        }

        function emitir(sistema, origen, velocidadBase, dispersion, vida, cantidad) {
            for (let n = 0; n < cantidad; n++) {
                const i = sistema.siguiente;
                sistema.siguiente = (sistema.siguiente + 1) % sistema.cantidad;
                sistema.posiciones[i * 3] = origen.x + (Math.random() - 0.5) * dispersion;
                sistema.posiciones[i * 3 + 1] = origen.y + Math.random() * dispersion * 0.5;
                sistema.posiciones[i * 3 + 2] = origen.z + (Math.random() - 0.5) * dispersion;
                sistema.velocidades[i * 3] = velocidadBase.x + (Math.random() - 0.5) * 2;
                sistema.velocidades[i * 3 + 1] = velocidadBase.y + Math.random() * 1.5;
                sistema.velocidades[i * 3 + 2] = velocidadBase.z + (Math.random() - 0.5) * 2;
                sistema.vidas[i] = vida * (0.7 + Math.random() * 0.3);
            }
        }

        function actualizarSistema(sistema, delta) {
            const p = sistema.posiciones, v = sistema.velocidades, vidas = sistema.vidas;
            for (let i = 0; i < sistema.cantidad; i++) {
                if (vidas[i] > 0) {
                    vidas[i] -= delta;
                    p[i * 3] += v[i * 3] * delta;
                    p[i * 3 + 1] += v[i * 3 + 1] * delta;
                    p[i * 3 + 2] += v[i * 3 + 2] * delta;
                    if (vidas[i] <= 0) p[i * 3 + 1] = -100;
                }
            }
            sistema.geo.attributes.position.needsUpdate = true;
        }

        // 9. CONTROLES TÁCTILES Y RATÓN
        function configurarControles() {
            const btnGas = document.getElementById('btn-gas'), btnFreno = document.getElementById('btn-freno');
            const btnIzq = document.getElementById('btn-izq'), btnDer = document.getElementById('btn-der');

            btnGas.addEventListener('touchstart', (e) => { e.preventDefault(); acelerando = true; });
            btnGas.addEventListener('touchend', (e) => { e.preventDefault(); acelerando = false; });
            btnGas.addEventListener('mousedown', () => acelerando = true);
            btnGas.addEventListener('mouseup', () => acelerando = false);

            btnFreno.addEventListener('touchstart', (e) => { e.preventDefault(); frenando = true; });
            btnFreno.addEventListener('touchend', (e) => { e.preventDefault(); frenando = false; });
            btnFreno.addEventListener('mousedown', () => frenando = true);
            btnFreno.addEventListener('mouseup', () => frenando = false);

            btnIzq.addEventListener('touchstart', (e) => { e.preventDefault(); direccion = -1; });
            btnIzq.addEventListener('touchend', (e) => { e.preventDefault(); direccion = 0; });
            btnIzq.addEventListener('mousedown', () => direccion = -1);
            btnIzq.addEventListener('mouseup', () => direccion = 0);

            btnDer.addEventListener('touchstart', (e) => { e.preventDefault(); direccion = 1; });
            btnDer.addEventListener('touchend', (e) => { e.preventDefault(); direccion = 0; });
            btnDer.addEventListener('mousedown', () => direccion = 1);
            btnDer.addEventListener('mouseup', () => direccion = 0);
            }
                                function actualizarParticulas(delta) {
            coche.updateMatrixWorld(true);
            const haciaAtras = new THREE.Vector3(Math.sin(coche.rotation.y), 0, -Math.cos(coche.rotation.y));

            if (acelerando && velocidad > 2) {
                const salidaIzq = coche.localToWorld(new THREE.Vector3(-0.45, 1.2, -2.9));
                const salidaDer = coche.localToWorld(new THREE.Vector3(0.45, 1.2, -2.9));
                const velEscape = haciaAtras.clone().multiplyScalar(4);
                emitir(sistemaEscape, salidaIzq, velEscape, 0.1, 0.5, 2);
                emitir(sistemaEscape, salidaDer, velEscape, 0.1, 0.5, 2);
            }

            if (velocidad > 5) {
                const traseras = [new THREE.Vector3(-1.2, 0.1, -1.4), new THREE.Vector3(1.2, 0.1, -1.4)];
                traseras.forEach(p => {
                    const origen = coche.localToWorld(p.clone());
                    emitir(sistemaPolvo, origen, haciaAtras.clone().multiplyScalar(velocidad * 0.1), 0.6, 0.6, 1);
                });
            }

            actualizarSistema(sistemaEscape, delta);
            actualizarSistema(sistemaPolvo, delta);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(reloj.getDelta(), 0.05);
            tiempoGlobal += delta;

            if (coche) {
                if (acelerando) velocidad += ACELERACION * delta;
                else if (frenando) velocidad -= FRENADO * delta;
                else velocidad -= 5 * delta;
                velocidad = Math.max(0, Math.min(velocidad, VELOCIDAD_MAXIMA));

                if (direccion !== 0 && velocidad > 1) {
                    coche.rotation.y -= direccion * VELOCIDAD_GIRO * delta * (velocidad / 10);
                }

                coche.position.x -= Math.sin(coche.rotation.y) * velocidad * delta;
                coche.position.z += Math.cos(coche.rotation.y) * velocidad * delta;
                coche.position.y = Math.sin(tiempoGlobal * 25) * 0.02;
                coche.rotation.z = Math.sin(tiempoGlobal * 15) * 0.01;

                // Ruedas: rodadura y dirección
                ruedas.forEach(r => {
                    r.giro.rotation.x += (velocidad * delta) / RADIO_RUEDA;
                    if (r.delantera) r.orientacion.rotation.y = direccion * 0.4;
                });

                // Cámara detrás del coche
                const offsetCamara = new THREE.Vector3(0, 4.5, -9.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), coche.rotation.y);
                const objetivoCamara = coche.position.clone().add(offsetCamara);
                camera.position.lerp(objetivoCamara, 0.1);

                const mirada = coche.position.clone();
                mirada.y += 1.6;
                camera.lookAt(mirada);

                actualizarParticulas(delta);
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
