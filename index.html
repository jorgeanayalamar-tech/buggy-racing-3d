<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beach Buggy Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Luckiest Guy', cursive; user-select: none; }
        canvas { display: block; }

        /* --- HUD --- */
        #hud-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .texto-hud { color: white; font-size: 22px; -webkit-text-stroke: 2px black; text-shadow: 3px 3px 0 #000; letter-spacing: 1px;}
        #barra-progreso { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 40%; height: 18px; background: rgba(0,0,0,0.5); border: 3px solid #fff; border-radius: 10px; display: flex; align-items: center; z-index: 10;}
        #barra-relleno { height: 100%; width: 15%; background: #00aaff; border-radius: 5px; }
        
        /* --- CONTROLES --- */
        #controles { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; z-index: 10; }
        .panel-metal { background: linear-gradient(to bottom, #d0d0d0, #808080); border: 3px solid #333; border-radius: 12px; padding: 10px; box-shadow: inset 0 0 10px rgba(255,255,255,0.6), 0 6px 0 #222; display: flex; gap: 8px; position: relative; }
        .panel-metal::before { content: ''; position: absolute; bottom: 4px; left: 10px; right: 10px; height: 8px; background-image: radial-gradient(#555 30%, transparent 35%); background-size: 8px 8px; background-position: center; opacity: 0.7; }
        .btn { width: 55px; height: 55px; border-radius: 8px; background: linear-gradient(to bottom, #666, #333); border: 2px solid #111; box-shadow: inset 0 2px 5px rgba(255,255,255,0.3); color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn:active { box-shadow: inset 0 5px 10px rgba(0,0,0,0.8); transform: translateY(4px); }
        
        /* --- ITEMS --- */
        .item-slot { position: absolute; top: 90px; width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: radial-gradient(circle, #66ccff, #0066cc); box-shadow: 0 0 15px #00aaff, inset 0 0 10px #003366; z-index: 10; display: flex; justify-content: center; align-items: center; }
        .item-slot::after { content: ''; width: 35px; height: 35px; border-radius: 50%; background: radial-gradient(circle, #ffcc00, #ff3300); box-shadow: 0 0 10px #ff3300; border: 2px solid white; }
        #item-izq { left: 15px; }
        #item-der { right: 15px; background: radial-gradient(circle, #66ff66, #006600); box-shadow: 0 0 15px #00ff00, inset 0 0 10px #003300; }
        #item-der::after { background: radial-gradient(circle, #ccffff, #0066ff); box-shadow: 0 0 10px #00aaff; }
    </style>
</head>
<body>

    <div id="hud-top">
        <div class="texto-hud">PUESTO 6/6</div>
        <div id="barra-progreso"><div id="barra-relleno"></div></div>
        <div class="texto-hud">VUELTA 1/1</div>
    </div>
    <div id="item-izq" class="item-slot"></div>
    <div id="item-der" class="item-slot"></div>

    <div id="controles">
        <div class="panel-metal">
            <div class="btn">◀</div>
            <div class="btn">▶</div>
        </div>
        <div class="panel-metal">
            <div class="btn" style="font-size:12px; width:65px; background:linear-gradient(to bottom, #ff4444, #aa0000);">FRENO</div>
            <div class="btn" style="font-size:12px; width:65px; background:linear-gradient(to bottom, #44ff44, #00aa00);">GAS</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, reloj;
        let coche, ruedas = [], fuegoEscape;
        let velocidad = 0;
        let acelerando = true; 

        function init() {
            // CONFIGURACIÓN PRO DEL RENDERIZADOR
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Evita lag en pantallas 4K
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1; 
            renderer.outputEncoding = THREE.sRGBEncoding; 
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            
            // CIELO REALISTA
            const canvasCielo = document.createElement('canvas');
            canvasCielo.width = 2; canvasCielo.height = 512;
            const ctxC = canvasCielo.getContext('2d');
            const grad = ctxC.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#1a75ff'); 
            grad.addColorStop(0.6, '#66b3ff'); 
            grad.addColorStop(1, '#cceeff'); 
            ctxC.fillStyle = grad; ctxC.fillRect(0, 0, 2, 512);
            const texturaCielo = new THREE.CanvasTexture(canvasCielo);
            scene.background = texturaCielo;
            scene.fog = new THREE.FogExp2(0xcceeff, 0.005);

            // CÁMARA CINEMÁTICA
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, -8);
            reloj = new THREE.Clock();

            // LUCES PROFESIONALES
            const sol = new THREE.DirectionalLight(0xfff5e6, 2.5);
            sol.position.set(40, 60, -30);
            sol.castShadow = true;
            sol.shadow.mapSize.width = 2048;
            sol.shadow.mapSize.height = 2048;
            sol.shadow.camera.left = -50;
            sol.shadow.camera.right = 50;
            sol.shadow.camera.top = 50;
            sol.shadow.camera.bottom = -50;
            sol.shadow.bias = -0.0005; // Evita artefactos en las sombras
            scene.add(sol);

            // Luz hemisférica (Cielo azul, rebote de tierra marrón)
            const ambiente = new THREE.HemisphereLight(0xffffff, 0x8b5a2b, 1.2);
            scene.add(ambiente);
                        // Iniciar creación
            crearEntorno(); 
            crearCochePro(); 
            crearFuegoEscape(); 

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function crearEntorno() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e3c28d'; ctx.fillRect(0, 0, 1024, 1024); 
            
            // Textura de arena granulada
            for (let i = 0; i < 80000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#d1ab70' : '#f0d5ab';
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
            }
            // Camino de tierra
            ctx.fillStyle = '#a87d4b';
            ctx.beginPath(); ctx.moveTo(412, 0); ctx.lineTo(612, 0); ctx.quadraticCurveTo(700, 512, 600, 1024); ctx.lineTo(424, 1024); ctx.quadraticCurveTo(324, 512, 412, 0); ctx.fill();
            
            const texturaSuelo = new THREE.CanvasTexture(canvas);
            texturaSuelo.wrapS = THREE.RepeatWrapping; texturaSuelo.wrapT = THREE.RepeatWrapping; texturaSuelo.repeat.set(15, 15);
            texturaSuelo.anisotropy = renderer.capabilities.getMaxAnisotropy(); // Textura nítida a lo lejos
            
            const suelo = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: texturaSuelo, roughness: 1.0 }));
            suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);

            // Agua
            const matAgua = new THREE.MeshStandardMaterial({ color: 0x0088cc, transparent: true, opacity: 0.85, roughness: 0.05, metalness: 0.4 });
            const aguaIzq = new THREE.Mesh(new THREE.PlaneGeometry(400, 1000), matAgua);
            aguaIzq.rotation.x = -Math.PI / 2; aguaIzq.position.set(-300, -0.1, 0); scene.add(aguaIzq);
            const aguaDer = aguaIzq.clone(); aguaDer.position.x = 300; scene.add(aguaDer);

            // Palmeras (Troncos curvos y hojas planas)
            const matTronco = new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.9 });
            const matHoja = new THREE.MeshStandardMaterial({ color: 0x1f7a1f, flatShading: true, side: THREE.DoubleSide });
            
            for (let i = 0; i < 40; i++) {
                const palmera = new THREE.Group();
                const puntos = []; for(let j=0; j<=5; j++) puntos.push(new THREE.Vector2(0.4 - j*0.05, j*1.5));
                const tronco = new THREE.Mesh(new THREE.LatheGeometry(puntos, 8), matTronco); tronco.castShadow = true; palmera.add(tronco);
                
                for (let j = 0; j < 7; j++) {
                    const hoja = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 6), matHoja);
                    hoja.position.y = 7.5; hoja.rotation.x = -Math.PI / 2.5; hoja.rotation.y = (Math.PI * 2 / 7) * j;
                    hoja.position.x = Math.sin((Math.PI * 2 / 7) * j) * 2.5; hoja.position.z = Math.cos((Math.PI * 2 / 7) * j) * 2.5;
                    hoja.castShadow = true; palmera.add(hoja);
                }
                const lado = Math.random() > 0.5 ? 1 : -1;
                palmera.position.set(lado * (30 + Math.random() * 50), 0, (Math.random() - 0.5) * 300); scene.add(palmera);
            }
        }

        function crearCochePro() {
            coche = new THREE.Group();

            // 1. CHASIS Y CARROCERÍA (Rojo con franjas blancas)
            const chasis = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.8, 4.2), new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.4, roughness: 0.3 }));
            chasis.position.y = 1.1; chasis.castShadow = true; chasis.receiveShadow = true; coche.add(chasis);

            const franja = new THREE.Mesh(new THREE.BoxGeometry(2.42, 0.82, 1.2), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.2, roughness: 0.4 }));
            franja.position.set(0, 1.1, 0.5); coche.add(franja);

            // 2. JAULA TUBULAR PROFESIONAL (Tubos negros)
            const matTubo = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.3 });
            const addTubo = (x, y, z, sx, sy, sz) => {
                const t = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, sy, 8), matTubo);
                t.position.set(x, y, z);
                if (sx > 0) t.rotation.z = Math.PI/2;
                if (sz > 0) t.rotation.x = Math.PI/2;
                t.castShadow = true; coche.add(t);
            };
            // Pilares
            addTubo(-1.1, 2.1, -0.8, 0, 1.8, 0);
            addTubo(1.1, 2.1, -0.8, 0, 1.8, 0);
            addTubo(-1.1, 2.1, 0.8, 0, 1.8, 0);
            addTubo(1.1, 2.1, 0.8, 0, 1.8, 0);
            // Techo
            addTubo(0, 3.0, -0.8, 2.2, 1, 0);
            addTubo(0, 3.0, 0.8, 2.2, 1, 0);
            addTubo(-1.1, 3.0, 0, 1, 1, 1.6);
            addTubo(1.1, 3.0, 0, 1, 1, 1.6);

            // 3. ASIENTOS (Cubos negros acolchados)
            const matAsiento = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const asientoIzq = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.7), matAsiento);
            asientoIzq.position.set(-0.5, 1.8, -0.2); coche.add(asientoIzq);
            const asientoDer = asientoIzq.clone(); asientoDer.position.x = 0.5; coche.add(asientoDer);

            // 4. FAROS DE TECHO (Faros LED cuadrados)
            const matLuz = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.0 });
            for(let i=0; i<4; i++){
                const faro = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.2), matLuz);
                faro.position.set(-0.75 + i*0.5, 3.1, 0.85); coche.add(faro);
            }

            // 5. PILOTO DETALLADO
            const piloto = new THREE.Group();
            // Cuerpo
            const cuerpoP = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.6, 8), new THREE.MeshStandardMaterial({color: 0xcc0000}));
            cuerpoP.position.y = 2.0; cuerpoP.castShadow = true; piloto.add(cuerpoP);
            // Brazos
            const brazoIzq = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8), new THREE.MeshStandardMaterial({color: 0xcc0000}));
            brazoIzq.position.set(-0.3, 2.1, 0.3); brazoIzq.rotation.x = Math.PI/3; piloto.add(brazoIzq);
            const brazoDer = brazoIzq.clone(); brazoDer.position.x = 0.3; piloto.add(brazoDer);
            // Casco
            const casco = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({color: 0xcc0000, metalness: 0.2, roughness: 0.2}));
            casco.position.y = 2.5; casco.castShadow = true; piloto.add(casco);
            // Visor
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.2), new THREE.MeshStandardMaterial({color: 0x111111, metalness: 1.0, roughness: 0.0}));
            visor.position.set(0, 2.5, 0.25); piloto.add(visor);
            
            piloto.position.set(0, 0, 0); coche.add(piloto);

            // 6. MOTOR Y ESCAPES
            const motor = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 1.0), new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.9, roughness: 0.4 }));
            motor.position.set(0, 1.4, -1.8); motor.castShadow = true; coche.add(motor);

            const matTuboEscape = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 1.0, roughness: 0.2 });
            const escapeIzq = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8), matTuboEscape);
            escapeIzq.rotation.x = Math.PI / 2; escapeIzq.position.set(-0.5, 1.2, -2.3); coche.add(escapeIzq);
            const escapeDer = escapeIzq.clone(); escapeDer.position.x = 0.5; coche.add(escapeDer);

            // 7. RUEDAS OFF-ROAD (Con tacos)
            const matGoma = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.95 });
            const matRin = new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.8, roughness: 0.2 });
            
            const posRuedas = [[-1.4, 0.9, 1.3], [1.4, 0.9, 1.3], [-1.4, 0.9, -1.3], [1.4, 0.9, -1.3]];
            posRuedas.forEach(pos => {
                const ruedaG = new THREE.Group();
                // Llanta
                const llanta = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.6, 16), matGoma);
                llanta.rotation.z = Math.PI / 2; llanta.castShadow = true; ruedaG.add(llanta);
                // Rin
                const rin = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.62, 8), matRin);
                rin.rotation.z = Math.PI / 2; ruedaG.add(rin);
                // Tacos de la rueda (para que se vea agresiva)
                for(let t=0; t<8; t++){
                    const taco = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.65), matGoma);
                    taco.position.set(Math.cos(t*Math.PI/4)*0.8, Math.sin(t*Math.PI/4)*0.8, 0);
                    taco.rotation.z = t*Math.PI/4;
                    ruedaG.add(taco);
                }
                ruedaG.position.set(pos[0], pos[1], pos[2]);
                coche.add(ruedaG); ruedas.push(ruedaG);
            });

            scene.add(coche);
        }

        function crearFuegoEscape() {
            const geo = new THREE.BufferGeometry();
            const posiciones = new Float32Array(100 * 3);
            const colores = new THREE.Float32BufferAttribute(new Float32Array(100 * 3), 3);
            for(let i=0; i<100*3; i+=3){
                posiciones[i] = 0; posiciones[i+1] = -10; posiciones[i+2] = 0;
                colores.setXYZ(i/3, 1.0, Math.random() * 0.5 + 0.5, 0);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
            geo.setAttribute('color', colores);
            const mat = new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
            fuegoEscape = new THREE.Points(geo, mat); scene.add(fuegoEscape);
        }

        function actualizarFuego(delta) {
            if (acelerando && velocidad > 0) {
                const pos = fuegoEscape.geometry.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    if (pos[i+1] < 0) {
                        pos[i] = coche.position.x + (Math.random() > 0.5 ? 0.5 : -0.5);
                        pos[i+1] = 1.2;
                        pos[i+2] = coche.position.z - 2.5; 
                        break;
                    }
                }
                for (let i = 1; i < pos.length; i += 3) {
                    if (pos[i] > 0) { pos[i] += delta * 2; pos[i+1] -= delta * 6; }
                }
                fuegoEscape.geometry.attributes.position.needsUpdate = true;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = reloj.getDelta();

            if (coche) {
                // Física de aceleración
                if (acelerando) { velocidad = THREE.MathUtils.lerp(velocidad, 30, delta * 1.5); } 
                else { velocidad = THREE.MathUtils.lerp(velocidad, 0, delta * 2); }

                // Vibración del motor y suspensión
                const tiempo = Date.now() * 0.01;
                coche.position.y = Math.sin(tiempo * 8) * 0.03;
                coche.rotation.x = Math.sin(tiempo * 4) * 0.01; // Cabeceo

                coche.position.z += velocidad * delta;
                ruedas.forEach(r => r.children[0].rotation.x += velocidad * delta * 1.2);

                // Cámara que sigue el coche suavemente
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, coche.position.x, 0.1);
                camera.position.z = coche.position.z - 8.5;
                camera.position.y = 4.2;
                camera.lookAt(coche.position.x, coche.position.y + 1.5, coche.position.z + 10);

                actualizarFuego(delta);
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
